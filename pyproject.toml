[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcd-terminal"
version = "0.6.0"
description = "麦麦交易终端：帮你点麦当劳最省的 Skill 与命令行引擎，自动叠加优惠券、积分和门店活动并实时核价（基于麦当劳中国 MCP）"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["httpx>=0.25", "typer>=0.12", "rich>=13", "segno>=1.5"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
mcd = "mcd_terminal.cli:app"

[tool.setuptools]
packages = ["mcd_terminal"]

[tool.setuptools.package-data]
mcd_terminal = ["skill/SKILL.md", "web/index.html"]
