<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>麦麦交易终端</title>
<style>
/* 麦麦交易终端 · 网页版
   Direction: a sticker sheet from a fast-food tray. Ink outlines and hard offset shadows on the
   things you can touch; everything else stays flat and quiet. Colour carries meaning:
   grape = 券, sun = 积分, pickle = 省下的钱, ketchup = 行动/快过期, bubblegum = 玩具周边. */
:root {
  --ink: #221c35;          /* text and outlines */
  --ink-2: #5d5775;
  --ink-3: #8f8aa6;
  --bg: #eef3ff;           /* soda blue */
  --surface: #ffffff;
  --sunken: #f4f6fd;
  --line: #dcdff0;
  --ketchup: #ff5a36;      /* primary action, urgent */
  --ketchup-soft: #ffe4dc;
  --sun: #ffc93c;          /* points */
  --sun-soft: #fff2c8;
  --sun-ink: #8a5a00;
  --grape: #7a5cff;        /* coupons */
  --grape-soft: #ece6ff;
  --pickle: #19a974;       /* money saved */
  --pickle-soft: #dcf6ea;
  --gum: #ff6fae;          /* toys and merch */
  --gum-soft: #ffe1ef;
  --paper: #fffdf7;        /* the receipt */
  --warn-ink: #a8430f; --ok-ink: #0d7a52; --on-ink: #ffffff;
  --shadow: 4px 4px 0 var(--ink);
  --shadow-s: 2px 2px 0 var(--ink);
  --r-s: 10px; --r-m: 16px; --r-l: 24px;
  --gutter: clamp(16px, 4vw, 72px);
  --font: "PingFang SC", "HarmonyOS Sans SC", "MiSans", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", "Menlo", "Consolas", "Noto Sans Mono CJK SC", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #f1eeff; --ink-2: #bdb7d8; --ink-3: #8c86a8;
    --bg: #17142a; --surface: #221d3a; --sunken: #1c1831; --line: #37305a;
    --ketchup-soft: #4a2420; --sun-soft: #43361a; --sun-ink: #ffd76a; --grape-soft: #2f2756;
    --pickle-soft: #173a30; --gum-soft: #46213a; --paper: #fffdf7;
    --warn-ink: #ffb48a; --ok-ink: #6fe0b0; --on-ink: #17142a;
    --shadow: 4px 4px 0 #07050f; --shadow-s: 2px 2px 0 #07050f; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--grape); outline-offset: 2px; }
img { display: block; max-width: 100%; }
a { color: var(--grape); }
.num { font-variant-numeric: tabular-nums; }
.hidden { display: none !important; }
.muted { color: var(--ink-3); }

/* ---------------------------------------------------------------- header */
header { background: var(--surface); border-bottom: 2px solid var(--ink); position: sticky; top: 0; z-index: 20; }
.bar { padding: 12px var(--gutter) 0; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
.brand b { font-size: 20px; font-weight: 900; letter-spacing: .5px; }
.brand small { color: var(--ink-3); font-size: 13px; }
.demo-flag { background: var(--sun); color: #221c35; font-size: 12px; padding: 0 9px; border-radius: 99px; font-weight: 700; border: 2px solid var(--ink); }
.store { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink-2); }
.store button { background: var(--surface); border: 2px solid var(--ink); border-radius: 99px; padding: 1px 12px; font-size: 13px; font-weight: 700; }
.mode { display: inline-flex; background: var(--sunken); border: 2px solid var(--ink); border-radius: 99px; padding: 2px; }
.mode button { border: 0; background: transparent; color: var(--ink-2); padding: 2px 14px; border-radius: 99px; font-size: 13px; font-weight: 600; }
.mode button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
nav { padding: 10px var(--gutter) 0; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
nav button { border: 2px solid transparent; border-bottom: 0; background: transparent; color: var(--ink-2); padding: 8px 16px 10px; font-size: 15px; font-weight: 600;
             border-radius: 14px 14px 0 0; white-space: nowrap; margin-bottom: -2px; }
nav button:hover { color: var(--ink); }
nav button[aria-selected="true"] { color: var(--ink); background: var(--bg); border-color: var(--ink); font-weight: 800; }
main { padding: clamp(20px, 3vw, 40px) var(--gutter) 96px; }
h2 { font-size: clamp(24px, 2.4vw, 32px); font-weight: 900; margin: 0 0 4px; letter-spacing: .5px; line-height: 1.25; }
h3 { font-size: 17px; margin: 0; font-weight: 800; }
.sub { color: var(--ink-2); margin: 0 0 22px; max-width: 70ch; }

/* ---------------------------------------------------------------- shared bits */
.btn { border: 2px solid var(--ink); border-radius: 99px; padding: 8px 20px; font-weight: 800; background: var(--surface); color: var(--ink);
       box-shadow: var(--shadow-s); transition: transform .08s, box-shadow .08s; }
.btn:hover { transform: translate(-1px, -1px); box-shadow: 3px 3px 0 var(--ink); }
.btn:active { transform: translate(2px, 2px); box-shadow: none; }
.btn.gold { background: var(--ketchup); color: #fff; }
.btn.ghost { background: var(--surface); }
.btn:disabled { opacity: .45; cursor: default; transform: none; box-shadow: none; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 0 9px; border-radius: 99px; background: var(--sunken); color: var(--ink-2); font-weight: 600; }
.chip.gold { background: var(--sun-soft); color: var(--sun-ink); }
.chip.tomato { background: var(--ketchup-soft); color: var(--ketchup); }
.chip.save { background: var(--pickle-soft); color: var(--pickle); }
.toy { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; padding: 0 9px; border-radius: 99px; background: var(--gum-soft); color: #c2186b; font-weight: 700; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .toy { color: var(--gum); } }
/* loading: three hopping stickers (券 / 积分 / 省), a shimmer for content that has a known shape */
.loader { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 56px 16px; color: var(--ink-2); text-align: center; }
.loader.small { padding: 18px 0; gap: 10px; }
.dots { display: inline-flex; gap: 10px; }
.dots i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--ink); background: var(--ketchup); }
.dots i:nth-child(2) { background: var(--sun); }
.dots i:nth-child(3) { background: var(--grape); }
.loader.small .dots i { width: 11px; height: 11px; }
.loader .hint2 { font-size: 13px; color: var(--ink-3); }
.skel { background: linear-gradient(90deg, var(--sunken) 0%, var(--surface) 50%, var(--sunken) 100%); background-size: 200% 100%; border-radius: 8px; }
.skel-card { border: 2px solid var(--line); border-radius: var(--r-m); padding: 14px 12px; display: grid; gap: 10px; background: var(--surface); }
.skel-card .skel:first-child { width: 72%; aspect-ratio: 1; border-radius: 50%; margin: 0 auto; }
.skel-line { height: 12px; }
.skel-row { display: grid; gap: 14px; }
.skel-box { border: 2px solid var(--line); border-radius: var(--r-m); background: var(--surface); padding: 16px; display: grid; gap: 10px; }
.skel-two { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 22px; }
.skel-side { display: grid; grid-template-columns: minmax(0, 1fr) clamp(280px, 22vw, 380px); gap: 22px; }
@media (max-width: 900px) { .skel-two, .skel-side { grid-template-columns: 1fr; } }
/* horizontal tiles: products of a campaign, prizes of a lottery */
.tiles { display: grid; grid-auto-flow: column; grid-auto-columns: 136px; gap: 12px; overflow-x: auto; padding: 4px 4px 10px 2px; }
.tiles.wrap { grid-auto-flow: row; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); overflow: visible; }
.tile { border: 2px solid var(--ink); border-radius: var(--r-m); background: var(--surface); padding: 10px 8px; text-align: center; display: grid; gap: 4px; align-content: start; }
.tile .plate { width: 76px; margin: 0 auto 2px; background: var(--sunken); }
.tile .plate .emoji { font-size: 32px; }
.tile b { font-size: 13px; line-height: 1.35; font-weight: 700; }
.tile small { color: var(--ink-3); font-size: 12px; }
.tile .num { font-weight: 900; }
.tile .btn { padding: 3px 10px; font-size: 12px; margin-top: 4px; justify-self: center; }
.tile.added { background: var(--sun-soft); }
.fallback { border: 2px dashed var(--ketchup); border-radius: var(--r-m); padding: 12px 14px; background: var(--ketchup-soft); color: var(--ink); font-size: 14px; }
.fallback .inline { margin-top: 8px; }
.btn.is-busy { pointer-events: none; opacity: .85; }
.btn.is-busy::after { content: ""; display: inline-block; width: 12px; height: 12px; margin-left: 8px; vertical-align: -1px; border-radius: 50%;
                      border: 2px solid currentColor; border-right-color: transparent; }
@media (prefers-reduced-motion: no-preference) {
  .dots i { animation: hop .9s ease-in-out infinite; }
  .dots i:nth-child(2) { animation-delay: .15s; }
  .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes hop { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-12px); } }
  .skel { animation: shimmer 1.2s linear infinite; }
  @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
  .btn.is-busy::after { animation: spin360 .7s linear infinite; }
  @keyframes spin360 { to { transform: rotate(360deg); } }
}
.empty { text-align: center; color: var(--ink-2); padding: 48px 16px; }
.empty .btn { margin-top: 12px; }
.err { background: var(--ketchup-soft); color: var(--ketchup); border: 2px solid var(--ketchup); border-radius: var(--r-m); padding: 12px 16px; margin: 0 0 16px; font-weight: 600; }
.loading { color: var(--ink-3); padding: 40px 0; text-align: center; }
.plate { background: #fff; border-radius: 50%; aspect-ratio: 1; display: grid; place-items: center; overflow: hidden; }
.plate img { width: 86%; height: 86%; object-fit: contain; }
.plate .emoji { font-size: 44px; }
.linkish { background: none; border: 0; color: var(--ketchup); padding: 0; font-weight: 800; }
.section-title { margin: 32px 0 4px; }

/* sticker: the touchable things */
.sticker { background: var(--surface); border: 2px solid var(--ink); border-radius: var(--r-m); box-shadow: var(--shadow); }

/* ---------------------------------------------------------------- today */
.hello { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 22px; margin-bottom: 28px; }
.hello-main { background: var(--surface); border: 2px solid var(--ink); border-radius: var(--r-l); box-shadow: var(--shadow); padding: clamp(20px, 2.6vw, 34px); }
.hello-main h2 { font-size: clamp(28px, 3vw, 40px); }
.points-big { display: flex; align-items: baseline; gap: 10px; margin: 18px 0 6px; }
.points-big .num { font-size: clamp(48px, 6vw, 76px); font-weight: 900; line-height: 1; letter-spacing: -2px; color: var(--ink);
                   text-decoration: underline; text-decoration-color: var(--sun); text-decoration-thickness: .22em; text-underline-offset: -.02em; text-decoration-skip-ink: none; }
.todo { list-style: none; margin: 20px 0 0; padding: 0; display: grid; gap: 10px; }
.todo li { display: flex; gap: 12px; align-items: center; }
.todo .ic { width: 32px; height: 32px; flex: none; display: grid; place-items: center; border-radius: 50%; background: var(--sun-soft); border: 2px solid var(--ink); font-size: 15px; }
.todo button { margin-left: 6px; }

/* posters (today page) */
.poster-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 18px; }
.poster { background: var(--surface); border: 2px solid var(--ink); border-radius: var(--r-m); box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; text-align: left; padding: 0;
          transition: transform .1s, box-shadow .1s; }
.poster:hover { transform: translate(-2px, -2px) rotate(-.4deg); box-shadow: 6px 6px 0 var(--ink); }
.poster .art { aspect-ratio: 16 / 10; background: var(--sun-soft); display: grid; place-items: center; overflow: hidden; border-bottom: 2px solid var(--ink); }
.poster .art img { width: 100%; height: 100%; object-fit: cover; }
.poster .art .emoji { font-size: 56px; }
.poster .body { padding: 12px 16px 16px; }
.poster h3 { font-size: 16px; line-height: 1.45; }
.poster p { margin: 6px 0 0; color: var(--ink-2); font-size: 14px; }

/* ---------------------------------------------------------------- activity map */
.map-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
.map-filters { display: flex; gap: 8px; flex-wrap: wrap; }
.map-filters button, .cats button { border: 2px solid var(--ink); background: var(--surface); border-radius: 99px; padding: 3px 14px; font-size: 14px; font-weight: 700; }
.map-filters button[aria-pressed="true"], .cats button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.map-wrap { display: grid; grid-template-columns: minmax(0, 1fr) clamp(280px, 22vw, 380px); gap: 22px; align-items: start; }
.map-scroll { overflow-x: auto; border-radius: var(--r-l); border: 2px solid var(--ink); box-shadow: var(--shadow); background: #bfe3ff; }
.map { display: block; width: 100%; min-width: 860px; height: auto; font-family: var(--font); }
.map .sea { fill: #bfe3ff; }
.map .land { stroke: #221c35; stroke-width: 2.5; }
.map .district-label { font-size: 17px; font-weight: 900; fill: #221c35; paint-order: stroke; stroke: #fff; stroke-width: 5px; stroke-linejoin: round; }
.map .district-count { font-size: 13px; font-weight: 600; fill: #5d5775; paint-order: stroke; stroke: #fff; stroke-width: 4px; }
.map .road { fill: none; stroke: #fff; stroke-width: 16; stroke-linecap: round; stroke-linejoin: round; }
.map .road-edge { fill: none; stroke: #221c35; stroke-width: 20; stroke-linecap: round; stroke-linejoin: round; }
.map .road-dash { fill: none; stroke: #ffc93c; stroke-width: 3; stroke-dasharray: 2 10; stroke-linecap: round; }
.map .wave { fill: none; stroke: rgba(255, 255, 255, .75); stroke-width: 2.5; stroke-linecap: round; }
.pin { cursor: pointer; }
.pin .ring { stroke: #221c35; stroke-width: 2.5; fill: #fff; }
.pin .halo { stroke-width: 5; fill: none; }
.pin.today .halo { stroke: #ff5a36; }
.pin.soon .halo { stroke: #7a5cff; }
.pin.past .halo { stroke: #c9c6d8; }
.pin.past image, .pin.past .pin-emoji { opacity: .5; }
.pin .shadow { fill: #221c35; }
.pin .pin-emoji { font-size: 24px; }
.pin.past .pin-art { opacity: .5; }
.ill { display: inline-grid; place-items: center; width: 62%; aspect-ratio: 1; line-height: 0; }
.ill svg { width: 100%; height: 100%; overflow: visible; }
.camp-art-empty svg { width: 46%; height: auto; }
.pin .badge-bg { fill: #ff6fae; stroke: #221c35; stroke-width: 2; }
.pin .badge { font-size: 13px; }
.pin:hover .halo, .pin:focus .halo, .pin.hot .halo { stroke-width: 8; }
.pin:focus { outline: none; }
.pin:focus-visible .ring { stroke: #7a5cff; stroke-width: 4; }
.pin.dim { opacity: .15; }
.pin .pulse { fill: none; stroke: #ff5a36; stroke-width: 3; opacity: 0; }
@media (prefers-reduced-motion: no-preference) {
  .pin.today .pulse { animation: pulse 1.6s ease-out 3; transform-box: fill-box; transform-origin: center; }
  @keyframes pulse { from { opacity: .8; transform: scale(1); } to { opacity: 0; transform: scale(1.9); } }
}
.wheel { cursor: pointer; }
.wheel:focus { outline: none; }
.wheel:focus-visible .rim { stroke: #7a5cff; }
@media (prefers-reduced-motion: no-preference) {
  .wheel .spokes { animation: spin 18s linear infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes spin { to { transform: rotate(360deg); } }
}
.map-swipe { display: none; }
.map-legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); margin: 12px 4px 0; }
.map-legend i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; border: 3px solid; margin-right: 6px; vertical-align: -2px; background: #fff; }
.guide { background: var(--surface); border: 2px solid var(--ink); border-radius: var(--r-l); box-shadow: var(--shadow); padding: 16px; max-height: min(78vh, 900px); overflow: auto; position: sticky; top: 130px; }
.guide h3 { font-size: 17px; margin: 2px 4px 10px; }
.guide-item { display: grid; grid-template-columns: 46px 1fr; gap: 10px; align-items: center; padding: 8px; border-radius: var(--r-s); width: 100%; text-align: left; background: none; border: 0; }
.guide-item:hover, .guide-item.hot { background: var(--sun-soft); }
.guide-item .thumb { width: 46px; height: 46px; border-radius: 50%; overflow: hidden; display: grid; place-items: center; background: #fff; border: 3px solid var(--line); }
.guide-item .thumb img { width: 100%; height: 100%; object-fit: cover; }
.guide-item .thumb .emoji { font-size: 22px; }
.guide-item .thumb .ill { width: 70%; }
.tile .plate .ill { width: 58%; }
.event .art .ill { width: 38%; }
.poster .art .ill { width: 44%; }
.goods .pic .ill { width: 56%; }
.guide-item.today .thumb { border-color: var(--ketchup); }
.guide-item.soon .thumb { border-color: var(--grape); }
.guide-item b { font-size: 14px; font-weight: 700; display: block; line-height: 1.35; }
.guide-item small { color: var(--ink-3); font-size: 12px; }
.camp-meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 0 0 10px; }
.camp-when { font-size: 13px; color: var(--ink-2); }
.timeline { display: flex; gap: 4px; margin: 12px 0 6px; flex-wrap: wrap; }
.timeline span { font-size: 12px; padding: 0 8px; border-radius: 99px; background: var(--sunken); color: var(--ink-2); }
.timeline span.on { background: var(--ketchup); color: #fff; font-weight: 700; }
.camp-art { width: 100%; border-radius: var(--r-m); margin-bottom: 14px; border: 2px solid var(--ink); }
.camp-detail { white-space: pre-line; color: var(--ink-2); font-size: 14px; max-height: 48vh; overflow: auto; }
.events-strip { margin-top: 32px; }
.events-row { display: grid; grid-auto-flow: column; grid-auto-columns: clamp(220px, 21vw, 300px); gap: 16px; overflow-x: auto; padding: 4px 6px 10px 2px; }
.event { background: var(--surface); border: 2px solid var(--ink); border-radius: var(--r-m); box-shadow: var(--shadow); overflow: hidden; text-align: left; padding: 0; }
.event .art { aspect-ratio: 16 / 9; background: var(--gum-soft); display: grid; place-items: center; overflow: hidden; border-bottom: 2px solid var(--ink); }
.event .art img { width: 100%; height: 100%; object-fit: cover; }
.event .art .emoji { font-size: 44px; }
.event .body { padding: 10px 14px 12px; }
.event b { font-size: 14px; display: block; line-height: 1.4; }
.event .row { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-2); margin-top: 4px; }
.event .row .num { color: var(--ketchup); font-weight: 800; }
.lottery-pool { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin: 12px 0; }

/* ---------------------------------------------------------------- order */
.order { display: grid; grid-template-columns: minmax(0, 1fr) clamp(330px, 26vw, 430px); gap: 28px; align-items: start; }
.cats { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding: 2px 2px 6px; scrollbar-width: thin; }
.cats button { white-space: nowrap; flex: none; }
.search { width: 100%; max-width: 560px; border: 2px solid var(--ink); background: var(--surface); border-radius: 99px; padding: 9px 18px; margin-bottom: 14px; }
.menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 16px; }
.dish { background: var(--surface); border: 2px solid var(--ink); border-radius: var(--r-m); padding: 14px 12px 12px; display: flex; flex-direction: column; gap: 8px; position: relative;
        box-shadow: var(--shadow-s); transition: transform .1s, box-shadow .1s; }
.dish:hover { transform: translate(-1px, -1px); box-shadow: var(--shadow); }
.dish .plate { width: 72%; margin: 0 auto; background: var(--sunken); }
.dish .name { font-size: 14px; font-weight: 600; line-height: 1.35; min-height: 38px; }
.dish .row { display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-wrap: wrap; row-gap: 6px; }
.dish .price { display: flex; flex-direction: column; line-height: 1.15; }
.dish .qty { margin-left: auto; }
/* grid items default to min-width:auto; let long rows (category chips) scroll inside instead of widening the page */
.order > *, .map-wrap > *, .assets > *, .orders > *, .hello > * { min-width: 0; }
html, body { overflow-x: clip; }
.dish .price { font-weight: 900; font-size: 16px; }
.dish .was { color: var(--ink-3); text-decoration: line-through; font-size: 12px; margin-left: 0; font-weight: 400; }
.dish .tags { display: flex; gap: 4px; flex-wrap: wrap; min-height: 20px; }
.qty { display: inline-flex; align-items: center; gap: 4px; }
.qty button { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--ink); background: var(--sun); color: #221c35; font-weight: 900; font-size: 17px; line-height: 1; padding: 0; }
.qty button.minus { background: var(--surface); color: var(--ink); }
.qty span { min-width: 20px; text-align: center; font-weight: 900; }
.dish.in-cart { background: var(--sun-soft); box-shadow: var(--shadow); }

/* the receipt */
.receipt-wrap { position: sticky; top: 130px; }
.receipt { background: var(--paper); color: #2b2620; font-family: var(--mono); font-size: 13px; padding: 22px 20px 26px; position: relative;
           border: 2px solid #221c35; border-bottom: 0; border-radius: var(--r-m) var(--r-m) 0 0;
           --tear: radial-gradient(circle at 8px 0, transparent 7px, var(--paper) 7.5px) 0 0 / 16px 10px repeat-x; }
.receipt::after { content: ""; position: absolute; left: -2px; right: -2px; bottom: -9px; height: 10px; background: var(--tear); transform: rotate(180deg); }
.receipt .hd { text-align: center; border-bottom: 2px dashed #d6ccba; padding-bottom: 10px; margin-bottom: 10px; }
.receipt .hd b { font-family: var(--font); font-size: 17px; font-weight: 900; display: block; }
.receipt .hd span { color: #847a6d; font-size: 12px; }
.rline { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 7px 0; border-bottom: 1px dotted #d8cfc1; }
.rline .what { font-family: var(--font); font-size: 14px; font-weight: 600; }
.rline .how { grid-column: 1 / -1; display: flex; justify-content: space-between; font-size: 12px; color: #847a6d; }
.rline .was { color: #a99f92; text-decoration: line-through; margin-right: 6px; }
.pay { font-weight: 800; }
.stamp { display: inline-block; font-family: var(--font); font-size: 11px; font-weight: 900; padding: 0 7px; border-radius: 99px; color: #fff; margin-right: 4px; }
.stamp.s-coupon { background: var(--grape); }
.stamp.s-points { background: var(--sun); color: #221c35; }
.stamp.s-cash { background: #b9b4c9; }
.rm { border: 0; background: none; padding: 0 2px; font-family: var(--font); font-size: 12px; font-weight: 700; color: #b0a594; text-decoration: underline; text-underline-offset: 2px; }
.rm:hover, .rm:focus-visible { color: var(--ketchup); }
.totals { margin-top: 12px; display: grid; gap: 3px; }
.totals div { display: flex; justify-content: space-between; }
.totals .big { font-size: 24px; font-weight: 900; margin-top: 4px; }
.saved { margin: 16px auto 0; width: max-content; max-width: 100%; text-align: center; color: #fff; background: var(--pickle); border: 2px solid #221c35;
         border-radius: 12px; padding: 4px 16px; transform: rotate(-4deg); font-family: var(--font); font-weight: 900; font-size: 20px; letter-spacing: 1px; box-shadow: 3px 3px 0 #221c35; }
.saved small { display: block; font-size: 11px; font-weight: 700; letter-spacing: 0; opacity: .9; }
.receipt .note { font-size: 12px; color: #847a6d; margin-top: 12px; font-family: var(--font); }
.extras { margin-top: 26px; display: grid; gap: 10px; }
.extra { background: var(--surface); border: 2px solid var(--ink); border-radius: var(--r-m); padding: 10px 12px; display: flex; gap: 10px; align-items: center; font-size: 14px; }
.extra p { margin: 0; flex: 1; }
.extra button { flex: none; }
.checkout { margin-top: 18px; display: flex; gap: 10px; align-items: center; }
.checkout .btn.gold { flex: 1; padding: 12px; font-size: 17px; }
.checkout .btn.ghost { flex: none; padding: 12px 18px; }
.campaign-hint { margin-top: 12px; font-size: 13px; color: var(--ink-2); }

/* ---------------------------------------------------------------- assets */
.assets { display: grid; grid-template-columns: clamp(280px, 24vw, 360px) minmax(0, 1fr); gap: 24px; align-items: start; }
.meter { background: var(--surface); border: 2px solid var(--ink); border-radius: var(--r-l); box-shadow: var(--shadow); padding: 22px; }
.meter .num.big { font-size: 52px; font-weight: 900; line-height: 1.1; letter-spacing: -1px; }
.bar-track { height: 14px; background: var(--sunken); border: 2px solid var(--ink); border-radius: 99px; overflow: hidden; margin: 14px 0 8px; display: flex; }
.bar-track i { display: block; height: 100%; }
.legend { display: flex; gap: 14px; font-size: 13px; color: var(--ink-2); flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; border: 1.5px solid var(--ink); }
.coupons { display: grid; gap: 14px; }
.coupon { display: grid; grid-template-columns: 104px 1fr auto; align-items: center; background: var(--surface); border: 2px solid var(--ink); border-radius: var(--r-m);
          box-shadow: var(--shadow-s); position: relative; }
.coupon::before, .coupon::after { content: ""; position: absolute; left: 95px; width: 18px; height: 18px; border-radius: 50%; background: var(--bg); border: 2px solid var(--ink); }
.coupon::before { top: -10px; border-top-color: transparent; border-left-color: transparent; transform: rotate(45deg); }
.coupon::after { bottom: -10px; border-bottom-color: transparent; border-right-color: transparent; transform: rotate(45deg); }
.coupon .left { align-self: stretch; display: grid; place-items: center; background: var(--grape); color: #fff; border-right: 2px dashed var(--ink); text-align: center; padding: 10px 4px;
                border-radius: 14px 0 0 14px; }
.coupon .left b { font-size: 24px; line-height: 1.1; display: block; font-weight: 900; }
.coupon .left small { font-size: 11px; display: block; opacity: .9; }
.coupon .mid { padding: 12px 16px; }
.coupon .mid h3 { font-size: 15px; }
.coupon .days { padding: 0 18px; text-align: right; }
.coupon .days b { font-size: 30px; display: block; line-height: 1; font-weight: 900; }
.coupon.urgent .days b { color: var(--ketchup); }
.coupon .days small { color: var(--ink-3); font-size: 12px; }
.mine { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; margin-top: 12px; }
.mine article { background: var(--surface); border: 2px solid var(--ink); border-radius: var(--r-m); padding: 12px; display: flex; gap: 12px; align-items: center; }
.mine .plate { width: 56px; flex: none; background: var(--gum-soft); }
.mine .plate .emoji { font-size: 26px; }
.mine h3 { font-size: 14px; }

/* ---------------------------------------------------------------- mall */
.mall-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 18px; }
.goods { background: var(--surface); border: 2px solid var(--ink); border-radius: var(--r-m); box-shadow: var(--shadow-s); padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.goods .pic { aspect-ratio: 4 / 3; background: var(--sunken); border-radius: var(--r-s); display: grid; place-items: center; overflow: hidden; }
.goods .pic img { width: 100%; height: 100%; object-fit: contain; }
.goods .pic .emoji { font-size: 48px; }
.goods h3 { font-size: 15px; line-height: 1.4; }
.goods .pts { font-size: 22px; font-weight: 900; color: var(--sun-ink); }
.vbar { height: 8px; background: var(--sunken); border-radius: 99px; overflow: hidden; }
.vbar i { display: block; height: 100%; background: var(--sun); }
.goods .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); }
.goods .btn { padding: 5px 14px; font-size: 13px; }
.spend { background: var(--sun); border: 2px solid var(--ink); border-radius: var(--r-l); box-shadow: var(--shadow); padding: 16px 22px; margin-bottom: 24px;
         display: flex; gap: 14px; align-items: center; flex-wrap: wrap; color: #221c35; }
.spend p { margin: 0; flex: 1; min-width: 220px; font-weight: 600; }

/* ---------------------------------------------------------------- orders */
.orders { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; align-items: start; }
.olist { display: grid; gap: 12px; }
.oitem { background: var(--surface); border: 2px solid var(--ink); border-radius: var(--r-m); padding: 14px 16px; text-align: left; }
.oitem[aria-current="true"] { background: var(--sun-soft); box-shadow: var(--shadow-s); }
.oitem .row { display: flex; justify-content: space-between; gap: 10px; }
.track { background: var(--surface); border: 2px solid var(--ink); border-radius: var(--r-l); box-shadow: var(--shadow); padding: 24px; position: sticky; top: 130px; }
.pickup { text-align: center; margin: 18px 0; }
.pickup b { font-size: 72px; font-weight: 900; letter-spacing: 8px; line-height: 1; display: block; }
.steps { display: flex; gap: 6px; margin: 16px 0; }
.steps span { flex: 1; height: 10px; border-radius: 99px; background: var(--sunken); border: 2px solid var(--ink); }
.steps span.on { background: var(--pickle); }

/* ---------------------------------------------------------------- settings */
dialog.wide { width: min(640px, calc(100vw - 32px)); }
dialog.xwide { width: min(900px, calc(100vw - 32px)); }
.camp-layout { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 22px; align-items: start; }
.camp-layout .camp-art { margin: 0; width: 100%; max-height: 420px; object-fit: cover; }
.camp-art-empty { aspect-ratio: 4 / 3; border: 2px solid var(--ink); border-radius: var(--r-m); background: var(--sun-soft); display: grid; place-items: center; font-size: 72px; }
.camp-layout .camp-detail { max-height: 230px; }
@media (max-width: 720px) { .camp-layout { grid-template-columns: 1fr; } .camp-layout .camp-art, .camp-art-empty { max-height: 220px; } }
.set { border-top: 2px dashed var(--line); padding: 16px 0 4px; }
.set:first-of-type { border-top: 0; padding-top: 4px; }
.set h4 { margin: 0 0 8px; font-size: 15px; font-weight: 800; }
.set .now { color: var(--ink-2); font-size: 14px; margin: 0 0 10px; }
.seg { justify-self: start; display: inline-flex; border: 2px solid var(--ink); border-radius: 99px; padding: 2px; background: var(--sunken); flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 3px 14px; border-radius: 99px; font-weight: 700; font-size: 14px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.addr-list { display: grid; gap: 8px; margin-bottom: 10px; }
.addr { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: center; text-align: left; width: 100%;
        border: 2px solid var(--line); border-radius: var(--r-s); padding: 10px 12px; background: var(--surface); }
.addr[aria-checked="true"] { border-color: var(--ink); background: var(--sun-soft); }
.addr .dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--ink); background: var(--surface); }
.addr[aria-checked="true"] .dot { background: var(--ink); box-shadow: inset 0 0 0 3px var(--sun-soft); }
.addr b { display: block; font-size: 14px; }
.addr small { color: var(--ink-3); }
.form { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; }
.form .full { grid-column: 1 / -1; }
.form label { margin: 6px 0 2px; }
.form select { width: 100%; border: 2px solid var(--ink); border-radius: 10px; padding: 7px 10px; background: var(--surface); }
.form .hint { font-size: 12px; color: var(--ketchup); min-height: 16px; }
.form input[aria-invalid="true"] { border-color: var(--ketchup); }
.inline { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.inline input { width: auto; flex: 1; min-width: 110px; }
@media (max-width: 560px) { .form { grid-template-columns: 1fr; } }

/* ---------------------------------------------------------------- dialogs etc. */
dialog { border: 2px solid var(--ink); border-radius: var(--r-l); padding: 0; width: min(460px, calc(100vw - 32px)); background: var(--surface); color: var(--ink); box-shadow: 6px 6px 0 #221c35; }
dialog::backdrop { background: rgba(34, 28, 53, .5); }
.dlg { padding: 24px; }
.dlg h3 { font-size: 20px; margin-bottom: 10px; font-weight: 900; }
.dlg ul { padding-left: 18px; margin: 10px 0; }
.dlg .actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; margin-top: 20px; }
.dlg label { display: block; font-size: 14px; color: var(--ink-2); margin: 10px 0 4px; font-weight: 600; }
.dlg input { width: 100%; border: 2px solid var(--ink); border-radius: 10px; padding: 8px 12px; background: var(--surface); }
.qr { width: 228px; height: 228px; margin: 14px auto; background: #fff; border-radius: 14px; padding: 8px; border: 2px solid #221c35; }
.qr svg { width: 100%; height: 100%; }
.pay-how { text-align: center; font-size: 14px; margin: 0 0 8px; }
/* lottery draw: a little wheel that spins while the server draws */
.draw-wheel { width: 132px; height: 132px; margin: 18px auto 8px; border-radius: 50%; border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink);
  background: conic-gradient(var(--ketchup) 0 60deg, var(--sun) 0 120deg, var(--grape) 0 180deg, var(--pickle) 0 240deg, var(--gum) 0 300deg, #fff 0 360deg); position: relative; }
.draw-wheel::after { content: ""; position: absolute; inset: 42%; background: var(--ink); border-radius: 50%; }
.draw-wheel.spin { animation: drawspin 0.6s linear infinite; }
@keyframes drawspin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .draw-wheel.spin { animation-duration: 3s; } }
.win { text-align: center; }
.win .tiles.wrap { grid-template-columns: repeat(auto-fit, 150px); justify-content: center; }
.cost { display: inline-block; background: var(--sun-soft); border: 2px solid var(--ink); border-radius: 999px; padding: 2px 12px; font-weight: 700; }
.stepper { justify-self: start; display: inline-flex; align-items: center; gap: 10px; }
.stepper button { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--ink); background: var(--sun); color: #221c35; font-weight: 800; cursor: pointer; }
.stepper b { min-width: 2ch; text-align: center; font-size: 18px; }
.seg { justify-self: start; display: inline-flex; border: 2px solid var(--ink); border-radius: 999px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 6px 14px; font-weight: 700; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }
.book-grid { display: grid; grid-template-columns: auto 1fr; gap: 10px 16px; align-items: center; margin: 12px 0; }
.book-grid > span { color: var(--muted, #6b6880); font-size: 14px; }
.survey { margin-top: 14px; border: 2px dashed var(--ink); border-radius: var(--r-m); padding: 10px 12px; background: var(--sun-soft); }
.survey b { display: block; }
.party-layout { grid-template-columns: minmax(0, 4fr) minmax(0, 8fr); }
.party-layout .camp-art { max-height: 300px; }
@media (max-width: 720px) { .party-layout { grid-template-columns: 1fr; } .party-layout .camp-art, .party-layout .camp-art-empty { max-height: 160px; } }
.party-bar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.party-bar .party-rules { margin: 0; flex: 1 1 260px; }
.party-bar .party-people { margin: 0; }
.party-store { margin: 10px 0 6px; font-size: 14px; }
.day-chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 8px; scrollbar-width: thin; }
.day-chips button { flex: 0 0 auto; display: grid; justify-items: center; gap: 2px; min-width: 72px; padding: 6px 10px; border: 2px solid var(--ink);
  border-radius: var(--r-m); background: var(--surface); cursor: pointer; font: inherit; }
.day-chips button[aria-selected="true"] { background: var(--ink); color: var(--on-ink); box-shadow: var(--shadow-s); }
.day-chips small { font-size: 11px; opacity: .8; }
.day-chips .dot { font-size: 11px; font-weight: 700; padding: 0 6px; border-radius: 99px; }
.day-chips .dot.ok { background: var(--pickle-soft); color: var(--ok-ink); }
.day-chips .dot.warn { background: var(--ketchup-soft); color: var(--warn-ink); }
.day-chips .dot.late, .day-chips .dot.full { background: var(--sunken); color: var(--ink-3); }
.session-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
.scard { display: grid; gap: 6px; align-content: start; border: 2px solid var(--ink); border-radius: var(--r-m); padding: 10px 12px; background: var(--surface); min-width: 0; }
.scard.best { border-color: var(--pickle); box-shadow: 4px 4px 0 var(--pickle); }
.scard.full { opacity: .55; }
.scard > b { font-size: 13px; }
.scard small { font-size: 12px; }
.scard .urgent { color: var(--ketchup); font-weight: 700; }
.scard .ok { color: var(--pickle); } .scard .warnv { color: var(--warn-ink); }
.scard .acts { display: flex; gap: 6px; }
.scard .acts .btn:last-child { flex: 1; }
.scard .pmeter { max-width: none; }
.party-rules { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 13px; background: var(--sun-soft); border: 2px solid var(--ink); border-radius: var(--r-m); padding: 8px 12px; margin: 8px 0; }
.party-people { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin: 10px 0; }
.sessions { display: grid; gap: 8px; }
.session { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr) auto; grid-template-areas: "when verdict acts" "fill fill fill";
  gap: 6px 14px; align-items: center; border: 2px solid var(--ink); border-radius: var(--r-m); padding: 8px 12px; background: var(--surface); }
.session > * { min-width: 0; }
.session .when { grid-area: when; } .session .verdict { grid-area: verdict; } .session .acts { grid-area: acts; display: flex; gap: 6px; }
.session .fill { grid-area: fill; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.session.best { box-shadow: 4px 4px 0 var(--pickle); border-color: var(--pickle); }
.session.full { opacity: .55; grid-template-areas: "when verdict acts"; }
.session.full .fill { display: none; }
.session small { display: block; font-size: 12px; }
.session .fill small { display: inline; }
.session .urgent { color: var(--ketchup); font-weight: 700; }
.session .verdict b { font-size: 13px; display: block; }
.session .ok { color: var(--pickle); }
.session .warnv { color: var(--warn-ink); }
@media (max-width: 560px) { .session { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "when acts" "verdict verdict" "fill fill"; } }
.pmeter { position: relative; display: flex; width: 100%; max-width: 180px; height: 10px; border: 2px solid var(--ink); border-radius: 999px; background: var(--surface); overflow: hidden; }
.pmeter i { display: block; height: 100%; }
.pmeter i.gap { background: repeating-linear-gradient(135deg, var(--ketchup-soft) 0 4px, var(--surface) 4px 8px); }
.pmeter b { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink); }
.risk { border-radius: var(--r-m); padding: 8px 12px; margin: 6px 0; font-size: 14px; border: 2px solid currentColor; }
.risk.bad { color: var(--warn-ink); background: var(--ketchup-soft); }
.risk.ok { color: var(--ok-ink); background: var(--pickle-soft); }
.linkish { border: 0; background: none; padding: 0; margin-top: 4px; color: var(--grape); text-decoration: underline; font-weight: 700; cursor: pointer; }
.invite { display: grid; gap: 6px; margin: 10px 0; }
.invite small { color: var(--ketchup); }
.invite textarea { width: 100%; font: inherit; font-size: 13px; border: 2px solid var(--ink); border-radius: var(--r-m); padding: 8px; resize: vertical; }
.invite .btn { justify-self: start; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.intake { background: var(--surface); border: 2px solid var(--ink); border-radius: var(--r-l); box-shadow: var(--shadow); padding: 16px 18px; margin: 0 0 20px; }
.intake-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.intake-head h3 { margin: 0; }
.intake-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr) minmax(0, 1fr); gap: 18px; margin-top: 12px; align-items: start; }
.intake-grid > * { min-width: 0; }
@media (max-width: 980px) { .intake-grid { grid-template-columns: 1fr; } }
.hero-kcal .big { font-size: 44px; font-weight: 900; line-height: 1; }
.hero-kcal .big small { font-size: 15px; font-weight: 600; color: var(--ink-2); }
.hero-kcal p { margin: 6px 0 10px; }
.split { display: flex; gap: 2px; height: 12px; border-radius: 999px; overflow: hidden; background: var(--surface); }
.split-legend { list-style: none; padding: 0; margin: 8px 0 0; display: grid; gap: 4px; font-size: 13px; }
.split-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.kcal-chart { margin: 0; position: relative; }
.kcal-chart figcaption { font-size: 13px; font-weight: 700; margin-bottom: 4px; }
.kcal-chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.kcal-chart .bar rect:first-child { fill: var(--grape); }
.kcal-chart .bar:hover rect:first-child { fill: #5b3fe0; }
.kcal-chart .hit { fill: transparent; }
.kcal-chart .refline { stroke: var(--ink-3); stroke-width: 1.5; stroke-dasharray: 5 5; }
.kcal-chart .base { stroke: var(--line); stroke-width: 1.5; }
.kcal-chart text { font-size: 11px; fill: var(--ink-3); }
.kcal-chart .reflabel { fill: var(--ink-2); }
.kcal-chart .tip { position: absolute; transform: translate(-50%, -100%); background: var(--ink); color: var(--on-ink); font-size: 12px; padding: 4px 8px; border-radius: 8px; white-space: nowrap; pointer-events: none; }
.top-items { display: grid; gap: 6px; font-size: 13px; }
.top-items .ti { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.top-items .ill { width: 30px; }
.warn { color: var(--ketchup); font-size: 14px; font-weight: 600; }
.toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 10px 18px; border-radius: 99px; z-index: 50; font-size: 14px; font-weight: 600; max-width: calc(100vw - 32px); }
footer { text-align: center; color: var(--ink-3); font-size: 13px; padding: 0 var(--gutter) 40px; }
footer a { color: inherit; }
.cartbar { display: none; }

/* ---------------------------------------------------------------- small screens */
@media (max-width: 900px) {
  .hello, .assets, .orders, .order, .map-wrap { grid-template-columns: 1fr; }
  .receipt-wrap, .track, .guide { position: static; }
  .guide { max-height: none; }
  .menu-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .map-swipe { display: block; }
  .brand small { display: none; }
  .cartbar { display: flex; position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 30; background: var(--ink); color: var(--surface);

<script>
"use strict";
const SECRET = "__MCD_SECRET__";
const DEMO = __MCD_DEMO__;
const $ = (s, el = document) => el.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const yuan = (v) => (v == null ? "—" : "¥" + Number(v).toFixed(2));
const state = { mapFilter: "all", tab: "today", mode: "pickup", menu: null, cart: new Map(), cat: "全部", q: "", plan: null, planSeq: 0, lastOrder: null };
if (DEMO) $("#demoFlag").classList.remove("hidden");

/* The button that triggered a request shows a spinner until the request finishes. */
let pressed = null;
document.addEventListener("click", (e) => { const b = e.target.closest("button"); pressed = b ? { b, t: performance.now() } : null; }, true);
async function run(args) {
  const btn = pressed && performance.now() - pressed.t < 250 && pressed.b.classList.contains("btn") ? pressed.b : null;
  pressed = null;
  if (btn) { btn.classList.add("is-busy"); btn.setAttribute("aria-busy", "true"); }
  try {
    const res = await fetch("/api/run", { method: "POST", headers: { "Content-Type": "application/json", "X-Mcd-Secret": SECRET },
                                           body: JSON.stringify({ args }) });
    if (!res.ok) return { ok: false, error: res.status === 403 ? "这个页面已经失效，请回到终端重新运行 mcd web" : "请求失败（" + res.status + "）" };
    return await res.json();
  } catch (e) {
    return { ok: false, error: "连不上本机服务，终端里的 mcd web 还开着吗？" };
  } finally {
    if (btn && btn.isConnected) { btn.classList.remove("is-busy"); btn.removeAttribute("aria-busy"); }
  }
}
function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.append(t);
  setTimeout(() => t.remove(), 3200);
}
const modeFlag = () => (state.mode === "delivery" ? "-d" : "-p");

};

/* disable a button and show a spinner on it while its action runs */
async function busy(btn, fn) {
  if (!btn || btn.classList.contains("is-busy")) return fn();
  btn.classList.add("is-busy"); btn.setAttribute("aria-busy", "true");
  try { return await fn(); } finally { if (btn.isConnected) { btn.classList.remove("is-busy"); btn.removeAttribute("aria-busy"); } }
}

const ART_RULES = [["薯", "fries"], ["鸡翅", "chicken"], ["鸡块", "chicken"], ["麦乐鸡", "chicken"], ["脆汁鸡", "chicken"], ["鸡腿", "burger"], ["堡", "burger"], ["巨无霸", "burger"],

function emojiFor(name) {

/* ---------------------------------------------------------------- today */
async function renderToday() {
  const m = $("#main"); m.innerHTML = loading("today", "正在整理今天的情况…");
  const [d, cal] = await Promise.all([run(["today"]), run(["calendar"])]);
  if (!d.ok) return showError(m, d.error);
  const p = d.points || {};
  const todo = [];
  if (p.expiring_soon) todo.push(["⏳", `${p.expiring_soon.toLocaleString()} 积分两个月内过期`, `<button class="linkish" data-go="mall">换成吃的</button>`]);
  for (const c of d.expiring_coupons || []) todo.push(["🎟", `${esc(c.title)} ${c.days_left === 0 ? "今天" : c.days_left === 1 ? "明天" : c.days_left + " 天后"}到期`, `<button class="linkish" data-go="order">去用</button>`]);
  if ((d.claimable || []).length) todo.push(["🎁", `麦麦省还有 ${d.claimable.length} 张券没领`, `<button class="linkish" id="claimBtn">一键领取</button>`]);
  if (!todo.length) todo.push(["✅", "券和积分都不着急，放心攒着", ""]);
  const today = (cal.campaigns || []).filter((x) => (x.tag || "").startsWith("今"));
  m.innerHTML = `
    <section class="hello">
      <div class="hello-main">
        <h2>${esc(d.greeting || "你好")}</h2>
        <p class="sub" style="margin:0">今天想吃点什么？手上的券和积分，我帮你算好怎么用最省。</p>
        <div class="points-big"><span class="num">${(p.available ?? 0).toLocaleString()}</span><span class="muted">积分可用</span></div>
        <ul class="todo">${todo.map(([i, t, a]) => `<li><span class="ic">${i}</span><span>${t}${a}</span></li>`).join("")}</ul>
        <p style="margin:22px 0 0"><button class="btn gold" data-go="order">开始点餐</button></p>
      </div>
      <div>${today.length ? posterRow(today.slice(0, 2), "today") : `<div class="hello-main"><h3>今天没有新活动</h3><p class="muted">看看最近的活动 <button class="linkish" data-go="campaigns">全部活动</button></p></div>`}</div>
    </section>`;
  m.querySelectorAll("[data-go]").forEach((b) => b.addEventListener("click", () => go(b.dataset.go)));
  bindPosters(m, today);
  const cb = $("#claimBtn"); if (cb) cb.addEventListener("click", claim);
}

/* macOS: straight into the Reminders app. Elsewhere: a calendar file the browser downloads. */
async function remindMe(args, label) {
  const d = await run(["remind", ...args, "-y"]);

/* ---------------------------------------------------------------- activity map */
/* Every campaign lands in a district of an illustrated map, by what it is about. */
const DISTRICTS = [
  { key: "toy", name: "周边玩具铺", emoji: "🧸", x: 790, y: 165, rx: 150, ry: 105, fill: "#ffc2dc",
    re: /玩具|盲盒|公仔|手办|乐园餐|周边|联名|联动|\sX\s|×|帽|丝巾|杯子|钥匙扣|徽章|挂件|限定主题|限量/ },
  { key: "party", name: "派对乐园", emoji: "🎈", x: 760, y: 440, rx: 165, ry: 110, fill: "#d9ceff",
    re: /派对|生日|体验营|读书会|亲子|品鉴|过家家/ },
  { key: "breakfast", name: "早餐小镇", emoji: "☀️", x: 185, y: 405, rx: 140, ry: 100, fill: "#ffe08a", re: /早餐|早八|厚松饼|满分|晨/ },
  { key: "coffee", name: "咖啡山丘", emoji: "☕", x: 445, y: 470, rx: 135, ry: 88, fill: "#f3d2b3", re: /咖啡|麦咖啡|拿铁|美式|奶铁|黑巧/ },
  { key: "new", name: "上新广场", emoji: "🆕", x: 230, y: 160, rx: 160, ry: 110, fill: "#b8f0d4", re: /上新|新品|回归|首发|来袭|登场|限定|🆕/ },
  { key: "deal", name: "优惠大街", emoji: "🎟", x: 515, y: 205, rx: 150, ry: 100, fill: "#ffd3c4",
    re: /\d+(\.\d+)?元|特价|优惠|券|半价|买一送一|立减|会员|卡|霸王餐|抽奖|超值/ },
];
const OTHER = { key: "other", name: "麦麦广场", emoji: "🍟", x: 1000, y: 118, rx: 72, ry: 74, fill: "#ffffff", re: /$^/ };
const ROAD = "M60 300 C 140 250, 200 250, 250 270 S 380 330, 450 330 S 560 300, 620 300 S 800 290, 985 300";

function districtOf(text) { return DISTRICTS.find((d) => d.re.test(text)) || OTHER; }
function toyKind(text) {
  if (/玩具|盲盒|公仔|手办|乐园餐/.test(text)) return "🧸 有玩具";
  if (/周边|联名|联动|\sX\s|×|帽|丝巾|杯子|钥匙扣|徽章|挂件|限定主题|限量/.test(text)) return "🎁 有周边";
  return "";
}
function parseDay(s, year) {
  const m = /(?:(\d{4})年)?(\d{1,2})月(\d{1,2})日/.exec(s || "");
  return m ? new Date(Number(m[1] || year), Number(m[2]) - 1, Number(m[3])) : null;
}
const md = (d) => `${d.getMonth() + 1}/${d.getDate()}`;

/* One pin per campaign: the calendar repeats a campaign on every day it runs. */
function mergeCampaigns(list) {
  const now = new Date(); now.setHours(0, 0, 0, 0);
  const byTitle = new Map();
  for (const c of list) {
    const day = parseDay(c.day, now.getFullYear());
    let x = byTitle.get(c.title);
    if (!x) byTitle.set(c.title, x = { title: c.title, intro: "", detail: "", image: "", days: [] });
    x.intro ||= c.intro || ""; x.detail ||= c.detail || ""; x.image ||= c.image || "";
    if (day && !x.days.some((d) => +d === +day)) x.days.push(day);
  }
  return [...byTitle.values()].map((x) => {
    x.days.sort((a, b) => a - b);
    const today = x.days.some((d) => +d === +now), future = x.days.some((d) => d > now);
    x.when = today ? "today" : future ? "soon" : "past";
    const text = [x.title, x.detail || x.intro].join(" ");
    x.district = districtOf(text); x.toy = toyKind(text);
    const first = x.days[0], last = x.days[x.days.length - 1];
    x.range = !first ? "" : +first === +last ? md(first) : `${md(first)} – ${md(last)}`;
    x.next = x.days.find((d) => d > now);
    return x;
  }).sort((a, b) => ({ today: 0, soon: 1, past: 2 })[a.when] - ({ today: 0, soon: 1, past: 2 })[b.when]);
}

/* Pins sit in a tidy grid inside their island, below its name, so nothing overlaps. */
function placePins(items) {
  const groups = new Map();
  for (const x of items) { const k = x.district.key; groups.set(k, [...(groups.get(k) || []), x]); }
  for (const [, xs] of groups) {
    const d = xs[0].district, gap = 64;
    const cols = Math.max(1, Math.min(xs.length, Math.floor((d.rx * 1.55) / gap)));
    xs.forEach((x, i) => {
      const row = Math.floor(i / cols), inRow = Math.min(cols, xs.length - row * cols), col = i % cols;
      x.px = d.x + (col - (inRow - 1) / 2) * gap;
      x.py = d.y - d.ry + 96 + row * gap;
    });
  }
}

function blob(d, seed) {
  // a soft, slightly uneven island instead of a perfect ellipse
  const pts = [], n = 10;
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2, wob = 1 + .09 * Math.sin(i * 2.3 + seed) + .05 * Math.cos(i * 3.7 + seed);
    pts.push([d.x + Math.cos(a) * d.rx * wob, d.y + Math.sin(a) * d.ry * wob]);
  }
  let p = `M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  for (let i = 0; i < n; i++) {
    const a = pts[i], b = pts[(i + 1) % n], c = pts[(i + 2) % n];
    const m1 = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2], m2 = [(b[0] + c[0]) / 2, (b[1] + c[1]) / 2];
    p += ` Q${b[0].toFixed(1)} ${b[1].toFixed(1)} ${m2[0].toFixed(1)} ${m2[1].toFixed(1)}`;
    if (i === 0) p = `M${m1[0].toFixed(1)} ${m1[1].toFixed(1)}` + p.slice(p.indexOf(" Q"));
  }
  return p + "Z";
}

function mapSvg(items, lot) {
  const used = new Set(items.map((x) => x.district.key));
  const ds = [...DISTRICTS, OTHER].filter((d) => used.has(d.key) || d !== OTHER);
  const counts = (k) => items.filter((x) => x.district.key === k).length;
  const waves = Array.from({ length: 14 }, (_, i) => {
    const x = 40 + (i * 73) % 1000, y = 40 + (i * 131) % 540;
    return `<path class="wave" d="M${x} ${y} q 8 -6 16 0 t 16 0"/>`;
  }).join("");
  const pins = items.map((x, i) => {
    const hasImg = x.image && !x.image.includes("img.example");
    return `<g class="pin ${x.when}" data-pin="${i}" tabindex="0" role="button" aria-label="${esc(x.title)}" transform="translate(${x.px.toFixed(1)} ${x.py.toFixed(1)})">
      <circle class="pulse" r="27"/>
      <circle class="shadow" r="27" cx="3" cy="3"/>
      <circle class="ring" r="27"/>
      <circle class="halo" r="22"/>
      <clipPath id="pc${i}"><circle r="20"/></clipPath>
      ${hasImg ? `<image href="${esc(imgSrc(x.image))}" x="-20" y="-20" width="40" height="40" preserveAspectRatio="xMidYMid slice" clip-path="url(#pc${i})"/>`
               : artKey(x.title) === "meal" ? `<text class="pin-emoji" text-anchor="middle" dominant-baseline="central">${esc(x.district.emoji)}</text>`
               : `<svg x="-17" y="-17" width="34" height="34" viewBox="0 0 64 64" class="pin-art">${ART[artKey(x.title)]}</svg>`}
      ${x.toy ? `<circle class="badge-bg" cx="20" cy="-20" r="11"/><text class="badge" x="20" y="-20" text-anchor="middle" dominant-baseline="central">${x.toy.startsWith("🧸") ? "🧸" : "🎁"}</text>` : ""}
      <title>${esc(x.title)}${x.range ? " · " + esc(x.range) : ""}</title>
    </g>`;
  }).join("");
  const wheel = lot ? `<g class="wheel" tabindex="0" role="button" aria-label="积分抽奖：${esc(lot.name)}" transform="translate(1022 300)">
      <path d="M-26 46 L0 0 L26 46" fill="none" stroke="#221c35" stroke-width="4" stroke-linejoin="round"/>
      <circle cx="3" cy="3" r="36" fill="#221c35"/>
      <circle class="rim" r="36" fill="#fff" stroke="#221c35" stroke-width="2.5"/>
      <g class="spokes">
      ${Array.from({ length: 8 }, (_, k) => `<line x1="0" y1="0" x2="${(Math.cos(k * Math.PI / 4) * 32).toFixed(1)}" y2="${(Math.sin(k * Math.PI / 4) * 32).toFixed(1)}" stroke="#221c35" stroke-width="2"/>`).join("")}
      ${Array.from({ length: 8 }, (_, k) => `<circle cx="${(Math.cos(k * Math.PI / 4 + .39) * 33).toFixed(1)}" cy="${(Math.sin(k * Math.PI / 4 + .39) * 33).toFixed(1)}" r="6" stroke="#221c35" stroke-width="1.5" fill="${["#ff5a36", "#7a5cff", "#ffc93c", "#ff6fae"][k % 4]}"/>`).join("")}
      </g>
      <circle r="8" fill="#ffc93c" stroke="#221c35" stroke-width="2"/>
      <text y="70" text-anchor="middle" class="district-label">🎰 积分抽奖</text>
      <title>${esc(lot.name)}</title></g>` : "";
  return `<svg class="map" viewBox="0 0 1080 600" role="img" aria-label="活动地图">
    <rect class="sea" width="1080" height="600"/>${waves}
    ${ds.map((d, i) => `<path class="land" d="${blob(d, i * 1.7)}" fill="${d.fill}"/>`).join("")}
    <path class="road-edge" d="${ROAD}"/><path class="road" d="${ROAD}"/><path class="road-dash" d="${ROAD}"/>
    ${ds.map((d) => `<text class="district-label" x="${d.x}" y="${d.y - d.ry + 30}" text-anchor="middle">${d.emoji} ${esc(d.name)}</text>
      <text class="district-count" x="${d.x}" y="${d.y - d.ry + 48}" text-anchor="middle">${counts(d.key) ? counts(d.key) + " 个活动" : "暂时没有"}</text>`).join("")}
    ${wheel}${pins}
  </svg>`;
}

/* Menu items a campaign mentions, at the store the user orders from. */
async function ensureMenu() {
  if (state.menu) return { ok: true };
  const d = await run(["menu", modeFlag(), "--limit", "500"]);
  if (d.ok) state.menu = d.items || [];
  return d;
}
function campaignItems(x) {
  const text = [x.title, x.detail || x.intro].join(" ").replace(/\s+/g, "");
  const hits = (state.menu || []).filter((m) => m.name.length >= 2 && text.includes(m.name.replace(/\s+/g, "")));
  hits.sort((a, b) => b.name.length - a.name.length);
  // drop "麦旋风" when "蓝莓爆爆珠麦旋风" is also there: keep the specific item
  return hits.filter((m, i) => !hits.slice(0, i).some((o) => o.name.includes(m.name))).slice(0, 8);
}
async function loadCampaignProducts(x) {
  const box = document.getElementById("campProducts"); if (!box) return;
  const d = await ensureMenu();
  if (!document.getElementById("campProducts")) return;
  const store = state.mode === "delivery" ? "外送门店" : ((state.config && state.config.store && state.config.store.name) || "你的门店");
  if (!d.ok) {
    box.innerHTML = `<div class="fallback">没能打开门店菜单：${esc(d.error)}<div class="inline"><button class="btn ghost" data-store>换一家门店</button></div></div>`;
  } else {
    const items = campaignItems(x);
    if (!items.length) {
      box.innerHTML = `<div class="fallback">${esc(store)}的菜单里现在没有这个活动的餐品——可能只在部分门店供应、已经售罄，或者还没开始。
        <div class="inline"><button class="btn ghost" data-store>换一家门店</button><button class="btn ghost" data-menu>看看菜单里有什么</button></div></div>`;
    } else {
      box.innerHTML = `<div class="tiles">${items.map((m, i) => `<div class="tile ${state.cart.get(m.code) ? "added" : ""}" data-tile="${i}">
          <div class="plate">${pic(m.image, m.name)}</div><b>${esc(m.name)}</b>
          <span class="num">${yuan(m.price_yuan)}</span>${toyKind([m.name, ...(m.tags || [])].join(" ")) ? `<span class="toy">${esc(toyKind([m.name, ...(m.tags || [])].join(" ")))}</span>` : ""}
          <button class="btn ghost" data-add="${i}">${state.cart.get(m.code) ? "再来一份" : "加入"}</button></div>`).join("")}</div>
        <p class="muted" style="font-size:12px;margin:2px 0 0">${esc(store)}的价格；加入后到「点餐」里会自动帮你叠券和积分。</p>`;
      box.querySelectorAll("[data-add]").forEach((b) => b.addEventListener("click", () => {
        const m = items[Number(b.dataset.add)];

/* ---- party: pick the session least likely to fall through ("凑不齐人") ---- */
const countdownText = (h) => (h <= 0 ? "已过提前预订期" : h < 1 ? "不到 1 小时" : h < 48 ? `还剩 ${Math.floor(h)} 小时` : `还剩 ${Math.floor(h / 24)} 天`);
function partyFit(x, kind, n) {
  const j = x.joined || 0, lo = x.min || 1, left = x.left ?? 99, hi = x.max ?? 99;
  const need = kind === "包场" ? Math.max(0, lo - n) : Math.max(0, lo - j - n);
  const fits = kind === "包场" ? n <= hi : n <= left;
  const expired = (x.hours_left ?? 1) <= 0;
  const verdict = expired ? "已过提前预订期，可能约不上" : !fits ? (kind === "拼团" ? `位置不够（只剩 ${left}）` : `人太多（最多 ${hi} 人）`)
    : kind === "包场" ? (need ? `包场至少 ${lo} 人，还差 ${need} 人` : "人够了，整场是你们的")
    : need ? `加上你们还差 ${need} 人成团` : j >= lo ? "已成团，直接加入" : "加上你们就成团";
  return { kind, need, fits, expired, safe: !need && fits && !expired, verdict };
}
// 人够时包场最稳（不靠别人）；人不够时拼团更有希望（别的家庭也会来报）
const fitOrder = (a, b) => (a.expired === b.expired ? 0 : a.expired ? 1 : -1) || (a.safe === b.safe ? 0 : a.safe ? -1 : 1) || a.need - b.need
  || (a.kind === b.kind ? 0 : (a.kind === (a.safe ? "包场" : "拼团")) ? -1 : 1);
function bestFit(x, kinds, n) {
  return kinds.map((k) => partyFit(x, k, n)).filter((f) => f.fits).sort(fitOrder)[0] || null;
}
function partyMeter(x, n, kind) {
  const max = Math.max(x.max || 12, 1), j = kind === "包场" ? 0 : Math.min(x.joined || 0, max), you = Math.min(n, max - j);
  const need = Math.max(0, (x.min || 1) - j - you);
  const pct = (v) => `${(v / max) * 100}%`;
  return `<span class="pmeter" aria-hidden="true"><i style="width:${pct(j)};background:var(--grape)"></i><i style="width:${pct(you)};background:var(--pickle)"></i><i class="gap" style="width:${pct(need)}"></i><b style="left:${pct(x.min || 1)}"></b></span>`;
}

async function loadSessions(e, city) {
  const box = document.getElementById("sessions"); if (!box) return;
  const d = await run(["party", String(e.spu_id), ...(city ? ["-c", city] : []), "--dates", "5"]);
  if (!document.getElementById("sessions")) return;
  if (d.status === "choose_city" && (d.cities || []).length) {
    box.innerHTML = `<p class="muted" style="font-size:13px">在哪个城市？</p><div class="map-filters">${d.cities.slice(0, 16).map((c) => `<button data-city="${esc(c)}">${esc(c)}</button>`).join("")}</div>`;
    box.querySelectorAll("[data-city]").forEach((b) => b.addEventListener("click", () => { box.innerHTML = loader("查询场次…", "", true); loadSessions(e, b.dataset.city); }));
    return;
  }
  if (!d.ok) { box.innerHTML = `<p class="warn">${esc(d.error)}</p>`; return; }
  const rules = d.rules || { advance_days: 3, types: ["包场", "拼团"] };
  const kinds = rules.types || ["包场", "拼团"];
  const rows = (d.days || []).flatMap((day) => (day.sessions || []).map((x) => ({ ...x, date: day.date })));
  const dayList = [...new Set(rows.map((x) => x.date))];
  const draw = () => {
    const n = state.partyPeople || 4;
    const fitOf = (x) => (x.left > 0 ? bestFit(x, kinds, n) : null);
    const open = rows.map((x, i) => ({ x, i, f: fitOf(x) })).filter((r) => r.f);
    open.sort((a, b) => fitOrder(a.f, b.f) || (b.x.joined || 0) - (a.x.joined || 0) || String(a.x.date).localeCompare(String(b.x.date)));
    const best = open.length && open[0].f.safe ? open[0].i : -1;
    if (!state.partyDay || !dayList.includes(state.partyDay)) state.partyDay = best >= 0 ? rows[best].date : dayList[0];
    const dayStatus = (day) => {
      const fs = rows.filter((x) => x.date === day).map(fitOf).filter(Boolean).sort(fitOrder);
      if (!fs.length) return ["满了", "full"];
      const f = fs[0];
      return f.expired ? ["可能约不上", "late"] : f.safe ? ["稳", "ok"] : [`差 ${f.need} 人`, "warn"];
    };
    const wk = (d) => "日一二三四五六"[new Date(d + "T00:00:00").getDay()];
    const shown = rows.map((x, i) => ({ x, i })).filter((r) => r.x.date === state.partyDay);
    box.innerHTML = `<div class="party-bar">
        <div class="party-rules">${kinds.includes("拼团") ? `<span>⚠ 拼团截止前凑不够最少人数，<b>自动取消并退款</b></span>` : ""}<span>⏳ 需提前 <b>${rules.advance_days}</b> 天预订</span></div>
        <div class="party-people"><span>我们几个人</span><div class="stepper"><button data-pp="-1" aria-label="少一人">−</button><b class="num">${n}</b><button data-pp="1" aria-label="多一人">+</button></div></div>
      </div>
      <p class="party-store"><b>${esc(d.store.name)}</b> <span class="muted">${esc(d.store.distance || "")} · ${esc(kinds.join(" / "))}</span></p>
      ${dayList.length ? `<div class="day-chips" role="tablist">${dayList.map((day) => { const [t, c] = dayStatus(day);
        return `<button role="tab" data-day="${esc(day)}" aria-selected="${day === state.partyDay}"><b class="num">${esc(day.slice(5))}</b><small>周${wk(day)}</small><span class="dot ${c}">${t}</span></button>`; }).join("")}</div>
      <div class="session-row">${shown.map(({ x, i }) => {
        const f = fitOf(x), urgent = x.hours_left > 0 && x.hours_left < 24;
        return `<div class="scard ${i === best ? "best" : ""} ${x.left > 0 ? "" : "full"}">
          <div class="when"><b class="num">${esc(x.start)}–${esc(x.end)}</b>${i === best ? ` <span class="chip save">最稳</span>` : ""}</div>
          ${x.left > 0 ? `${partyMeter(x, n, f ? f.kind : "拼团")}<small class="muted">已报 ${x.joined || 0} · 至少 ${x.min} · 最多 ${x.max}</small>` : `<small class="muted">已约满</small>`}
          ${f ? `<b class="${f.safe ? "ok" : "warnv"}">${esc(f.kind)}：${esc(f.verdict)}</b>` : ""}
          <small class="${urgent || (x.hours_left ?? 1) <= 0 ? "urgent" : "muted"}">拉人截止 ${esc(String(x.deadline || "").slice(5, 10))} · ${countdownText(x.hours_left ?? 99)}${x.price_yuan != null ? ` · ¥${x.price_yuan}/人` : ""}</small>
          ${x.left > 0 ? `<div class="acts"><button class="btn ghost" data-rs="${i}" aria-label="提醒我">⏰</button><button class="btn ${i === best ? "gold" : "ghost"}" data-book="${i}">预约</button></div>` : ""}
        </div>`;
      }).join("")}</div>` : `<p class="muted">最近没有可约的场次。</p>`}
      <p class="muted" style="font-size:12px;margin:8px 0 0">已报人数按“最多人数 − 剩余位置”推算，截止时间按“提前 ${rules.advance_days} 天预订”推算，都以 App 为准。</p>`;
    box.querySelectorAll("[data-pp]").forEach((b) => b.addEventListener("click", () => { state.partyPeople = Math.min(30, Math.max(1, n + Number(b.dataset.pp))); state.partyDay = null; draw(); }));
    box.querySelectorAll("[data-day]").forEach((b) => b.addEventListener("click", () => { state.partyDay = b.dataset.day; draw(); }));
    box.querySelectorAll("[data-book]").forEach((b) => b.addEventListener("click", () => bookParty(e, d, rows[Number(b.dataset.book)], kinds, n)));
    box.querySelectorAll("[data-rs]").forEach((b) => b.addEventListener("click", () => {
      const x = rows[Number(b.dataset.rs)];
      remindMe(["party", "-t", `${e.name}（${d.store.name}）`, "--date", x.date, "--at", String(x.start).slice(0, 5)], "派对提醒");
    }));
  };
  draw();
}

async function bookParty(e, d, x, kinds, people) {
  const base = ["party", String(e.spu_id), "-c", d.city || "", "--book", "--date", x.date, "--time", String(x.start).slice(0, 5)];
  $("#dlg").classList.remove("xwide"); $("#dlg").classList.add("wide");
  setDialog(`<h3>预约 ${esc(e.name)}</h3>${loader("确认场次…", "", true)}`);
  const first = await run([...base, "--count", String(people)]);
  if (!first.ok && !/人数不对/.test(first.error || "")) {
    setDialog(`<h3>约不了</h3><p class="err">${esc(first.error)}</p><div class="actions"><button class="btn" data-close>知道了</button></div>`); return;
  }
  const bk = first.booking || {};
  const base5 = Math.max(1, bk.min && bk.type === "包场" ? bk.min : 1);
  let kind = (bestFit(x, kinds, people) || { kind: kinds[0] }).kind, n = people;
  const each = x.price_yuan;   // 每人价格
  const draw = () => {
    const f = partyFit(x, kind, n);
    const lo = kind === "包场" ? Math.max(x.min || 1, base5) : 1, hi = kind === "拼团" ? Math.min(x.max || 99, x.left || 99) : (x.max || 99);
    const other = kinds.length > 1 ? partyFit(x, kind === "包场" ? "拼团" : "包场", n) : null;
    const risk = f.safe ? `<div class="risk ok">${kind === "包场" ? "整场只有你们，不用等别人凑团" : `加上你们已经够 ${x.min} 人，能成团`}</div>`
      : `<div class="risk bad">⚠ ${esc(f.verdict)}${kind === "拼团" && f.need ? `：${esc(String(x.deadline).slice(5))} 前凑不齐会<b>自动取消并退款</b>（${countdownText(x.hours_left)}）` : ""}
          ${other && other.safe ? `<br><button class="linkish" data-switch>改成${esc(other.kind)}：${esc(other.verdict)}</button>` : ""}</div>`;
    setDialog(`<h3>预约 ${esc(e.name)}</h3>
      <p class="muted">${esc(d.city || "")} ${esc(d.store.name)}</p>
      <div class="book-grid">
        <span>场次</span><b class="num">${esc(x.date)} ${esc(x.start)}–${esc(x.end)}</b>
        <span>方式</span>${kinds.length < 2 ? `<b>${esc(kind)}</b>` : `<div class="seg" role="group">${kinds.map((k) => `<button data-kind="${k}" aria-pressed="${k === kind}">${k}</button>`).join("")}</div>`}
        <span>人数</span><div class="stepper"><button data-n="-1" aria-label="少一人">−</button><b class="num">${n}</b><button data-n="1" aria-label="多一人">+</button></div>
        <span>报名</span><div>${partyMeter(x, n, kind)}<small class="muted" style="display:block">${kind === "拼团" ? `已报 ${x.joined || 0} + 你们 ${n} / 至少 ${x.min}` : `你们 ${n} / 至少 ${lo}`}</small></div>
        <span>价格</span><b class="num">${each != null ? `约 ${yuan(each * n)} <small class="muted" style="font-weight:400">（¥${each}/人 × ${n}）</small>` : "以下单页为准"}</b>
      </div>
      ${risk}
      <p class="muted" style="font-size:13px">下单后扫码付款，退改以活动规则为准。</p>
      <div class="actions"><button class="btn ghost" data-close>先不约</button><button class="btn gold" data-yes ${n < lo || n > hi || !f.fits ? "disabled" : ""}>${kind === "拼团" && f.need ? "预约，我去拉人" : "确认预约"}</button></div>`,
      (dlg) => {
        dlg.querySelectorAll("[data-kind]").forEach((b) => b.addEventListener("click", () => { kind = b.dataset.kind; draw(); }));
        const sw = dlg.querySelector("[data-switch]"); if (sw) sw.addEventListener("click", () => { kind = other.kind; draw(); });
        dlg.querySelectorAll("[data-n]").forEach((b) => b.addEventListener("click", () => { n = Math.min(hi, Math.max(lo, n + Number(b.dataset.n))); draw(); }));
        dlg.querySelector("[data-yes]").addEventListener("click", () => submit(f));
      });
  };
  const submit = async (f) => {
    setDialog(`<h3>正在预约…</h3>${loader("向门店锁定场次、创建订单", "请不要关闭页面", true)}`);
    const r = await run([...base, "--type", kind, "--count", String(n), "-y"]);
    if (!r.ok || r.status !== "booked") {
      setDialog(`<h3>没有约上</h3><p class="err">${esc(r.error || "请稍后再试")}</p><div class="actions"><button class="btn" data-close>知道了</button></div>`); return;
    }
    const o = r.order || {};
    const cut = (r.reminders || []).find((c) => c.includes("拉人截止"));
    const m = cut ? cut.match(/--date (\S+) --at (\S+)/) : null;
    setDialog(`${await payBody("预约成功，扫码付款", o)}
      ${r.invite_text ? `<div class="invite"><b>拉人文案</b>${f.need ? `<small>还差 ${f.need} 人成团，发到亲友群吧</small>` : ""}<textarea readonly rows="4">${esc(r.invite_text)}</textarea>
        <button class="btn ghost" data-copy>复制文案</button></div>` : ""}
      <div class="actions"><button class="btn ghost" data-close>关闭</button>${m ? `<button class="btn ghost" data-cut>⏰ 截止前提醒我看人齐没</button>` : ""}<button class="btn gold" data-rem>⏰ 那天提醒我</button></div>`,
      (dlg2) => {

          remindMe(["party", "-t", `${e.name}（${d.store.name}）`, "--date", x.date, "--at", String(x.start).slice(0, 5)], "派对提醒"));

/* ---------------------------------------------------------------- intake stats
   One hero number per period + energy split + a 30-day bar chart (single series, one hue,
   a dashed reference line at the daily reference). Values are labelled in ink, never in the bar color. */
const PERIODS = [["today", "今天"], ["week", "本周"], ["month", "本月"], ["all", "全部记录"]];
async function loadIntake() {
  const box = document.getElementById("intake"); if (!box) return;
  const d = await run(["stats"]);
  if (!document.getElementById("intake")) return;
  if (!d.ok) { box.innerHTML = `<p class="muted">${esc(d.error)}</p>`; return; }
  if (!d.recorded_orders) { box.innerHTML = `<p class="muted">点过的单会在这里统计热量：今天、本周、本月吃了多少。</p>`; return; }
  const ref = (d.reference || {}).kcal_per_day || 2000, sodiumRef = (d.reference || {}).sodium_mg_per_day || 2000;
  const draw = () => {
    const key = state.intakeP || "week", p = d.periods[key] || {};
    const split = p.energy_split || null;
    const share = p.share_of_daily_kcal != null ? Math.round(p.share_of_daily_kcal * 100) : null;
    const days = d.daily || [];
    const max = Math.max(ref * 1.1, ...days.map((x) => x.kcal));
    const W = 600, H = 150, pad = 22, bw = (W - 8) / days.length;
    const y = (v) => H - pad - (v / max) * (H - pad - 8);
    const bars = days.map((x, i) => x.kcal ? `<g class="bar" data-i="${i}"><rect x="${(4 + i * bw + 1).toFixed(1)}" y="${y(x.kcal).toFixed(1)}" width="${Math.max(bw - 2, 2).toFixed(1)}" height="${(H - pad - y(x.kcal)).toFixed(1)}" rx="3"/>
        <rect class="hit" x="${(4 + i * bw).toFixed(1)}" y="0" width="${bw.toFixed(1)}" height="${H - pad}"/></g>` : "").join("");
    const ticks = days.map((x, i) => (i % 7 === days.length % 7 || i === days.length - 1) ? `<text x="${(4 + i * bw + bw / 2).toFixed(1)}" y="${H - 6}" text-anchor="middle">${esc(x.date.slice(5))}</text>` : "").join("");
    box.innerHTML = `<div class="intake-head"><h3>吃了多少 <small class="muted">只算麦当劳订单</small></h3>
        <div class="seg" role="group" aria-label="时间">${PERIODS.map(([k, t]) => `<button data-p="${k}" aria-pressed="${k === key}">${t}</button>`).join("")}</div></div>
      <div class="intake-grid">
        <div class="hero-kcal">
          <div class="num big">${(p.kcal || 0).toLocaleString()}<small> 千卡</small></div>
          <p class="muted">${p.orders || 0} 单${key !== "today" && p.kcal ? ` · 日均 ${p.kcal_per_day.toLocaleString()} 千卡` : ""}${share != null && p.kcal ? ` · 约 ${share}% 参考量` : ""}</p>
          ${split ? `<div class="split" role="img" aria-label="能量来源：蛋白质 ${Math.round(split.protein * 100)}%，脂肪 ${Math.round(split.fat * 100)}%，碳水 ${Math.round(split.carbs * 100)}%">
              <i style="flex:${split.protein};background:var(--grape)"></i><i style="flex:${split.fat};background:#e8a400"></i><i style="flex:${split.carbs};background:var(--pickle)"></i></div>
            <ul class="split-legend">
              <li><i style="background:var(--grape)"></i>蛋白质 <b>${p.protein_g} 克</b> <span class="muted">${Math.round(split.protein * 100)}%</span></li>
              <li><i style="background:#e8a400"></i>脂肪 <b>${p.fat_g} 克</b> <span class="muted">${Math.round(split.fat * 100)}%</span></li>
              <li><i style="background:var(--pickle)"></i>碳水 <b>${p.carbs_g} 克</b> <span class="muted">${Math.round(split.carbs * 100)}%</span></li>
            </ul>
            <p class="muted" style="font-size:13px;margin:6px 0 0">钠 ${(p.sodium_mg || 0).toLocaleString()} 毫克（参考上限 ${sodiumRef.toLocaleString()}/天）· 花费 ${yuan((p.spent_fen || 0) / 100)}</p>` : `<p class="muted">这段时间没有点餐记录。</p>`}
        </div>
        <figure class="kcal-chart">
          <figcaption>最近 ${days.length} 天每天的热量 <span class="muted">· 虚线是参考量 ${ref.toLocaleString()} 千卡</span></figcaption>
          <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="最近 ${days.length} 天每天从麦当劳摄入的热量">
            <line class="refline" x1="4" x2="${W - 4}" y1="${y(ref).toFixed(1)}" y2="${y(ref).toFixed(1)}"/>
            <text class="reflabel" x="${W - 6}" y="${(y(ref) - 4).toFixed(1)}" text-anchor="end">${ref}</text>
            <line class="base" x1="4" x2="${W - 4}" y1="${H - pad}" y2="${H - pad}"/>${bars}${ticks}
          </svg>
          <div class="tip" hidden></div>
        </figure>
        ${(p.top || []).length ? `<div class="top-items"><b>热量来源</b>${p.top.slice(0, 4).map((x) => `<div class="ti"><span class="ill">${artSvg(artKey(x.name))}</span><span>${esc(x.name)} <small class="muted">x${x.count}</small></span><span class="num">${x.kcal.toLocaleString()} 千卡</span></div>`).join("")}</div>` : ""}
      </div>
      ${(p.not_counted || []).length ? `<p class="muted" style="font-size:12px">没查到营养数据、没算进去：${p.not_counted.map((x) => esc(x.name)).join("、")}</p>` : ""}
      <p class="muted" style="font-size:12px;margin:4px 0 0">营养数据来自麦当劳官方营养表，套餐按组成拆开计算；参考量按成年人（${ref} 千卡/天），只作对照。${d.since ? `记录从 ${esc(d.since)} 开始，越用越完整。` : ""}</p>`;
    box.querySelectorAll("[data-p]").forEach((b) => b.addEventListener("click", () => { state.intakeP = b.dataset.p; draw(); }));
    const tip = box.querySelector(".kcal-chart .tip"), fig = box.querySelector(".kcal-chart");
    box.querySelectorAll(".bar").forEach((g) => {
      g.addEventListener("mouseenter", () => {
        const x = days[Number(g.dataset.i)], r = g.getBoundingClientRect(), f = fig.getBoundingClientRect();
        tip.innerHTML = `<b>${esc(x.date.slice(5))}</b> ${x.kcal.toLocaleString()} 千卡 · ${x.orders} 单`;
        tip.hidden = false; tip.style.left = `${r.left - f.left + r.width / 2}px`; tip.style.top = `${r.top - f.top - 8}px`;
      });
      g.addEventListener("mouseleave", () => { tip.hidden = true; });
    });
  };
  draw();
}

async function showTrack(oid) {
  const t = $("#track"); t.innerHTML = `${loader("查询出餐进度…", "", true)}<div aria-hidden="true" style="display:grid;gap:10px">${sk("30%", 22)}${sk("100%", 10)}${sk("40%", 60, "margin:12px auto")}${sk("60%")}</div>`;
  const d = await run(["track", oid]);
  if (!d.ok) return showError(t, d.error);
  const o = d.order || {};
  const st = o.status || "";
  const done = /完成|已取|送达/.test(st), cancelled = /取消|退款/.test(st);
  const step = cancelled ? 0 : done ? 4 : /配送|送餐/.test(st) ? 3 : /制作|备餐/.test(st) ? 2 : /支付|接单|已下单/.test(st) && !/待支付/.test(st) ? 1 : 0;
  t.innerHTML = `<h3>${esc(st)}</h3><p class="muted" style="margin:4px 0 0">${esc(o.hint || "")}</p>
    <div class="steps" aria-hidden="true">${[1, 2, 3, 4].map((i) => `<span class="${i <= step ? "on" : ""}"></span>`).join("")}</div>
    ${o.pickup_code && !done && !cancelled ? `<div class="pickup"><span class="muted">取餐码</span><b class="num">${esc(o.pickup_code)}</b></div>` : ""}
    <p>${esc(o.store || "")}${o.delivery_address ? " → " + esc(o.delivery_address) : ""}</p>
    <ul>${(o.items || []).map((x) => `<li>${esc(x.name)} x${esc(x.quantity)}</li>`).join("")}</ul>
    <p>实付 <b class="num">¥${esc(o.pay_yuan)}</b>${o.discount_yuan && o.discount_yuan !== "0" ? `，优惠 ¥${esc(o.discount_yuan)}` : ""}</p>
    ${!done && !cancelled ? `<p style="display:flex;gap:8px"><button class="btn ghost" id="refresh">刷新</button><button class="btn ghost" id="cancel">取消这单</button></p>` : ""}
    ${done ? `<div class="survey" id="survey">${loader("看看这单的问卷送没送券…", "", true)}</div>` : ""}`;
  if (done) loadSurvey(oid);
  const r = $("#refresh"); if (r) r.addEventListener("click", () => showTrack(oid));
  const c = $("#cancel"); if (c) c.addEventListener("click", () => openDialog(`<h3>取消这单？</h3><p>取消后不能恢复；如果已经付过款，退款会原路退回。</p>
    <div class="actions"><button class="btn ghost" data-close>不取消了</button><button class="btn" data-yes>确定取消</button></div>`,
    (dlg) => dlg.querySelector("[data-yes]").addEventListener("click", async () => {
      const x = await run(["cancel", oid, "-y"]); closeDialog(); toast(x.ok ? "这单已经取消了" : x.error); renderOrders();
    })));
}
