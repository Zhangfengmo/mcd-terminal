<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>麦麦交易终端</title>
<style>
/* 麦麦交易终端 · 网页版
   Direction: a sticker sheet from a fast-food tray. Ink outlines and hard offset shadows on the
   things you can touch; everything else stays flat and quiet. Colour carries meaning:
   grape = 券, sun = 积分, pickle = 省下的钱, ketchup = 行动/快过期, bubblegum = 玩具周边. */
:root {
  --ink: #221c35;          /* text and outlines */
  --ink-2: #5d5775;
  --ink-3: #8f8aa6;
  --bg: #eef3ff;           /* soda blue */
  --surface: #ffffff;
  --sunken: #f4f6fd;
  --line: #dcdff0;
  --ketchup: #ff5a36;      /* primary action, urgent */
  --ketchup-soft: #ffe4dc;
  --sun: #ffc93c;          /* points */
  --sun-soft: #fff2c8;
  --sun-ink: #8a5a00;
  --grape: #7a5cff;        /* coupons */
  --grape-soft: #ece6ff;
  --pickle: #19a974;       /* money saved */
  --pickle-soft: #dcf6ea;
  --gum: #ff6fae;          /* toys and merch */
  --gum-soft: #ffe1ef;
  --paper: #fffdf7;        /* the receipt */
  --shadow: 4px 4px 0 var(--ink);
  --shadow-s: 2px 2px 0 var(--ink);
  --r-s: 10px; --r-m: 16px; --r-l: 24px;
  --gutter: clamp(16px, 4vw, 72px);
  --font: "PingFang SC", "HarmonyOS Sans SC", "MiSans", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", "Menlo", "Consolas", "Noto Sans Mono CJK SC", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #f1eeff; --ink-2: #bdb7d8; --ink-3: #8c86a8;
    --bg: #17142a; --surface: #221d3a; --sunken: #1c1831; --line: #37305a;
    --ketchup-soft: #4a2420; --sun-soft: #43361a; --sun-ink: #ffd76a; --grape-soft: #2f2756;
    --pickle-soft: #173a30; --gum-soft: #46213a; --paper: #fffdf7;
    --shadow: 4px 4px 0 #07050f; --shadow-s: 2px 2px 0 #07050f; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--grape); outline-offset: 2px; }
img { display: block; max-width: 100%; }
a { color: var(--grape); }
.num { font-variant-numeric: tabular-nums; }
.hidden { display: none !important; }
.muted { color: var(--ink-3); }

/* ---------------------------------------------------------------- header */
header { background: var(--surface); border-bottom: 2px solid var(--ink); position: sticky; top: 0; z-index: 20; }
.bar { padding: 12px var(--gutter) 0; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
.brand b { font-size: 20px; font-weight: 900; letter-spacing: .5px; }
.brand small { color: var(--ink-3); font-size: 13px; }
.demo-flag { background: var(--sun); color: #221c35; font-size: 12px; padding: 0 9px; border-radius: 99px; font-weight: 700; border: 2px solid var(--ink); }
.store { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink-2); }
.store button { background: var(--surface); border: 2px solid var(--ink); border-radius: 99px; padding: 1px 12px; font-size: 13px; font-weight: 700; }
.mode { display: inline-flex; background: var(--sunken); border: 2px solid var(--ink); border-radius: 99px; padding: 2px; }
.mode button { border: 0; background: transparent; color: var(--ink-2); padding: 2px 14px; border-radius: 99px; font-size: 13px; font-weight: 600; }
.mode button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
nav { padding: 10px var(--gutter) 0; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
nav button { border: 2px solid transparent; border-bottom: 0; background: transparent; color: var(--ink-2); padding: 8px 16px 10px; font-size: 15px; font-weight: 600;
             border-radius: 14px 14px 0 0; white-space: nowrap; margin-bottom: -2px; }
nav button:hover { color: var(--ink); }
nav button[aria-selected="true"] { color: var(--ink); background: var(--bg); border-color: var(--ink); font-weight: 800; }
main { padding: clamp(20px, 3vw, 40px) var(--gutter) 96px; }
h2 { font-size: clamp(24px, 2.4vw, 32px); font-weight: 900; margin: 0 0 4px; letter-spacing: .5px; line-height: 1.25; }
h3 { font-size: 17px; margin: 0; font-weight: 800; }
.sub { color: var(--ink-2); margin: 0 0 22px; max-width: 70ch; }

/* ---------------------------------------------------------------- shared bits */
.btn { border: 2px solid var(--ink); border-radius: 99px; padding: 8px 20px; font-weight: 800; background: var(--surface); color: var(--ink);
       box-shadow: var(--shadow-s); transition: transform .08s, box-shadow .08s; }
.btn:hover { transform: translate(-1px, -1px); box-shadow: 3px 3px 0 var(--ink); }
.btn:active { transform: translate(2px, 2px); box-shadow: none; }
.btn.gold { background: var(--ketchup); color: #fff; }
.btn.ghost { background: var(--surface); }
.btn:disabled { opacity: .45; cursor: default; transform: none; box-shadow: none; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 0 9px; border-radius: 99px; background: var(--sunken); color: var(--ink-2); font-weight: 600; }
.chip.gold { background: var(--sun-soft); color: var(--sun-ink); }
.chip.tomato { background: var(--ketchup-soft); color: var(--ketchup); }
.chip.save { background: var(--pickle-soft); color: var(--pickle); }
.toy { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; padding: 0 9px; border-radius: 99px; background: var(--gum-soft); color: #c2186b; font-weight: 700; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .toy { color: var(--gum); } }
/* loading: three hopping stickers (券 / 积分 / 省), a shimmer for content that has a known shape */
.loader { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 56px 16px; color: var(--ink-2); text-align: center; }
.loader.small { padding: 18px 0; gap: 10px; }
.dots { display: inline-flex; gap: 10px; }
.dots i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--ink); background: var(--ketchup); }
.dots i:nth-child(2) { background: var(--sun); }
.dots i:nth-child(3) { background: var(--grape); }
.loader.small .dots i { width: 11px; height: 11px; }
.loader .hint2 { font-size: 13px; color: var(--ink-3); }
.skel { background: linear-gradient(90deg, var(--sunken) 0%, var(--surface) 50%, var(--sunken) 100%); background-size: 200% 100%; border-radius: 8px; }
.skel-card { border: 2px solid var(--line); border-radius: var(--r-m); padding: 14px 12px; display: grid; gap: 10px; background: var(--surface); }
.skel-card .skel:first-child { width: 72%; aspect-ratio: 1; border-radius: 50%; margin: 0 auto; }
.skel-line { height: 12px; }
.skel-row { display: grid; gap: 14px; }
.skel-box { border: 2px solid var(--line); border-radius: var(--r-m); background: var(--surface); padding: 16px; display: grid; gap: 10px; }
.skel-two { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 22px; }
.skel-side { display: grid; grid-template-columns: minmax(0, 1fr) clamp(280px, 22vw, 380px); gap: 22px; }
@media (max-width: 900px) { .skel-two, .skel-side { grid-template-columns: 1fr; } }
/* horizontal tiles: products of a campaign, prizes of a lottery */
.tiles { display: grid; grid-auto-flow: column; grid-auto-columns: 136px; gap: 12px; overflow-x: auto; padding: 4px 4px 10px 2px; }
.tiles.wrap { grid-auto-flow: row; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); overflow: visible; }
.tile { border: 2px solid var(--ink); border-radius: var(--r-m); background: var(--surface); padding: 10px 8px; text-align: center; display: grid; gap: 4px; align-content: start; }
.tile .plate { width: 76px; margin: 0 auto 2px; background: var(--sunken); }
.tile .plate .emoji { font-size: 32px; }
.tile b { font-size: 13px; line-height: 1.35; font-weight: 700; }
.tile small { color: var(--ink-3); font-size: 12px; }
.tile .num { font-weight: 900; }
.tile .btn { padding: 3px 10px; font-size: 12px; margin-top: 4px; justify-self: center; }
.tile.added { background: var(--sun-soft); }
.fallback { border: 2px dashed var(--ketchup); border-radius: var(--r-m); padding: 12px 14px; background: var(--ketchup-soft); color: var(--ink); font-size: 14px; }
.fallback .inline { margin-top: 8px; }
.btn.is-busy { pointer-events: none; opacity: .85; }
.btn.is-busy::after { content: ""; display: inline-block; width: 12px; height: 12px; margin-left: 8px; vertical-align: -1px; border-radius: 50%;
                      border: 2px solid currentColor; border-right-color: transparent; }
@media (prefers-reduced-motion: no-preference) {
  .dots i { animation: hop .9s ease-in-out infinite; }
  .dots i:nth-child(2) { animation-delay: .15s; }
  .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes hop { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-12px); } }
  .skel { animation: shimmer 1.2s linear infinite; }
  @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
  .btn.is-busy::after { animation: spin360 .7s linear infinite; }
  @keyframes spin360 { to { transform: rotate(360deg); } }
}
.empty { text-align: center; color: var(--ink-2); padding: 48px 16px; }
.empty .btn { margin-top: 12px; }
.err { background: var(--ketchup-soft); color: var(--ketchup); border: 2px solid var(--ketchup); border-radius: var(--r-m); padding: 12px 16px; margin: 0 0 16px; font-weight: 600; }
.loading { color: var(--ink-3); padding: 40px 0; text-align: center; }
.plate { background: #fff; border-radius: 50%; aspect-ratio: 1; display: grid; place-items: center; overflow: hidden; }
.plate img { width: 86%; height: 86%; object-fit: contain; }
.plate .emoji { font-size: 44px; }
.linkish { background: none; border: 0; color: var(--ketchup); padding: 0; font-weight: 800; }
.section-title { margin: 32px 0 4px; }

/* sticker: the touchable things */
.sticker { background: var(--surface); border: 2px solid var(--ink); border-radius: var(--r-m); box-shadow: var(--shadow); }

/* ---------------------------------------------------------------- today */
.hello { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 22px; margin-bottom: 28px; }
.hello-main { background: var(--surface); border: 2px solid var(--ink); border-radius: var(--r-l); box-shadow: var(--shadow); padding: clamp(20px, 2.6vw, 34px); }
.hello-main h2 { font-size: clamp(28px, 3vw, 40px); }
.points-big { display: flex; align-items: baseline; gap: 10px; margin: 18px 0 6px; }
.points-big .num { font-size: clamp(48px, 6vw, 76px); font-weight: 900; line-height: 1; letter-spacing: -2px; color: var(--ink);
                   text-decoration: underline; text-decoration-color: var(--sun); text-decoration-thickness: .22em; text-underline-offset: -.02em; text-decoration-skip-ink: none; }
.todo { list-style: none; margin: 20px 0 0; padding: 0; display: grid; gap: 10px; }
.todo li { display: flex; gap: 12px; align-items: center; }
.todo .ic { width: 32px; height: 32px; flex: none; display: grid; place-items: center; border-radius: 50%; background: var(--sun-soft); border: 2px solid var(--ink); font-size: 15px; }
.todo button { margin-left: 6px; }

/* posters (today page) */
.poster-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 18px; }
.poster { background: var(--surface); border: 2px solid var(--ink); border-radius: var(--r-m); box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; text-align: left; padding: 0;
          transition: transform .1s, box-shadow .1s; }
.poster:hover { transform: translate(-2px, -2px) rotate(-.4deg); box-shadow: 6px 6px 0 var(--ink); }
.poster .art { aspect-ratio: 16 / 10; background: var(--sun-soft); display: grid; place-items: center; overflow: hidden; border-bottom: 2px solid var(--ink); }
.poster .art img { width: 100%; height: 100%; object-fit: cover; }
.poster .art .emoji { font-size: 56px; }
.poster .body { padding: 12px 16px 16px; }
.poster h3 { font-size: 16px; line-height: 1.45; }
.poster p { margin: 6px 0 0; color: var(--ink-2); font-size: 14px; }

/* ---------------------------------------------------------------- activity map */
.map-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
.map-filters { display: flex; gap: 8px; flex-wrap: wrap; }
.map-filters button, .cats button { border: 2px solid var(--ink); background: var(--surface); border-radius: 99px; padding: 3px 14px; font-size: 14px; font-weight: 700; }
.map-filters button[aria-pressed="true"], .cats button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.map-wrap { display: grid; grid-template-columns: minmax(0, 1fr) clamp(280px, 22vw, 380px); gap: 22px; align-items: start; }
.map-scroll { overflow-x: auto; border-radius: var(--r-l); border: 2px solid var(--ink); box-shadow: var(--shadow); background: #bfe3ff; }
.map { display: block; width: 100%; min-width: 860px; height: auto; font-family: var(--font); }
.map .sea { fill: #bfe3ff; }
.map .land { stroke: #221c35; stroke-width: 2.5; }
.map .district-label { font-size: 17px; font-weight: 900; fill: #221c35; paint-order: stroke; stroke: #fff; stroke-width: 5px; stroke-linejoin: round; }
.map .district-count { font-size: 13px; font-weight: 600; fill: #5d5775; paint-order: stroke; stroke: #fff; stroke-width: 4px; }
.map .road { fill: none; stroke: #fff; stroke-width: 16; stroke-linecap: round; stroke-linejoin: round; }
.map .road-edge { fill: none; stroke: #221c35; stroke-width: 20; stroke-linecap: round; stroke-linejoin: round; }
.map .road-dash { fill: none; stroke: #ffc93c; stroke-width: 3; stroke-dasharray: 2 10; stroke-linecap: round; }
.map .wave { fill: none; stroke: rgba(255, 255, 255, .75); stroke-width: 2.5; stroke-linecap: round; }
.pin { cursor: pointer; }
.pin .ring { stroke: #221c35; stroke-width: 2.5; fill: #fff; }
.pin .halo { stroke-width: 5; fill: none; }
.pin.today .halo { stroke: #ff5a36; }
.pin.soon .halo { stroke: #7a5cff; }
.pin.past .halo { stroke: #c9c6d8; }
.pin.past image, .pin.past .pin-emoji { opacity: .5; }
.pin .shadow { fill: #221c35; }
.pin .pin-emoji { font-size: 24px; }
.pin .badge-bg { fill: #ff6fae; stroke: #221c35; stroke-width: 2; }
.pin .badge { font-size: 13px; }
.pin:hover .halo, .pin:focus .halo, .pin.hot .halo { stroke-width: 8; }
.pin:focus { outline: none; }
.pin:focus-visible .ring { stroke: #7a5cff; stroke-width: 4; }
.pin.dim { opacity: .15; }
.pin .pulse { fill: none; stroke: #ff5a36; stroke-width: 3; opacity: 0; }
@media (prefers-reduced-motion: no-preference) {
  .pin.today .pulse { animation: pulse 1.6s ease-out 3; transform-box: fill-box; transform-origin: center; }
  @keyframes pulse { from { opacity: .8; transform: scale(1); } to { opacity: 0; transform: scale(1.9); } }
}
.wheel { cursor: pointer; }
.wheel:focus { outline: none; }
.wheel:focus-visible .rim { stroke: #7a5cff; }
@media (prefers-reduced-motion: no-preference) {
  .wheel .spokes { animation: spin 18s linear infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes spin { to { transform: rotate(360deg); } }
}
.map-swipe { display: none; }
.map-legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); margin: 12px 4px 0; }
.map-legend i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; border: 3px solid; margin-right: 6px; vertical-align: -2px; background: #fff; }
.guide { background: var(--surface); border: 2px solid var(--ink); border-radius: var(--r-l); box-shadow: var(--shadow); padding: 16px; max-height: min(78vh, 900px); overflow: auto; position: sticky; top: 130px; }
.guide h3 { font-size: 17px; margin: 2px 4px 10px; }
.guide-item { display: grid; grid-template-columns: 46px 1fr; gap: 10px; align-items: center; padding: 8px; border-radius: var(--r-s); width: 100%; text-align: left; background: none; border: 0; }
.guide-item:hover, .guide-item.hot { background: var(--sun-soft); }
.guide-item .thumb { width: 46px; height: 46px; border-radius: 50%; overflow: hidden; display: grid; place-items: center; background: #fff; border: 3px solid var(--line); }
.guide-item .thumb img { width: 100%; height: 100%; object-fit: cover; }
.guide-item .thumb .emoji { font-size: 22px; }
.guide-item.today .thumb { border-color: var(--ketchup); }
.guide-item.soon .thumb { border-color: var(--grape); }
.guide-item b { font-size: 14px; font-weight: 700; display: block; line-height: 1.35; }
.guide-item small { color: var(--ink-3); font-size: 12px; }
.camp-meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 0 0 10px; }
.camp-when { font-size: 13px; color: var(--ink-2); }
.timeline { display: flex; gap: 4px; margin: 12px 0 6px; flex-wrap: wrap; }
.timeline span { font-size: 12px; padding: 0 8px; border-radius: 99px; background: var(--sunken); color: var(--ink-2); }
.timeline span.on { background: var(--ketchup); color: #fff; font-weight: 700; }
.camp-art { width: 100%; border-radius: var(--r-m); margin-bottom: 14px; border: 2px solid var(--ink); }
.camp-detail { white-space: pre-line; color: var(--ink-2); font-size: 14px; max-height: 48vh; overflow: auto; }
.events-strip { margin-top: 32px; }
.events-row { display: grid; grid-auto-flow: column; grid-auto-columns: clamp(220px, 21vw, 300px); gap: 16px; overflow-x: auto; padding: 4px 6px 10px 2px; }
.event { background: var(--surface); border: 2px solid var(--ink); border-radius: var(--r-m); box-shadow: var(--shadow); overflow: hidden; text-align: left; padding: 0; }
.event .art { aspect-ratio: 16 / 9; background: var(--gum-soft); display: grid; place-items: center; overflow: hidden; border-bottom: 2px solid var(--ink); }
.event .art img { width: 100%; height: 100%; object-fit: cover; }
.event .art .emoji { font-size: 44px; }
.event .body { padding: 10px 14px 12px; }
.event b { font-size: 14px; display: block; line-height: 1.4; }
.event .row { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-2); margin-top: 4px; }
.event .row .num { color: var(--ketchup); font-weight: 800; }
.lottery-pool { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin: 12px 0; }

/* ---------------------------------------------------------------- order */
.order { display: grid; grid-template-columns: minmax(0, 1fr) clamp(330px, 26vw, 430px); gap: 28px; align-items: start; }
.cats { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding: 2px 2px 6px; scrollbar-width: thin; }
.cats button { white-space: nowrap; flex: none; }
.search { width: 100%; max-width: 560px; border: 2px solid var(--ink); background: var(--surface); border-radius: 99px; padding: 9px 18px; margin-bottom: 14px; }
.menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 16px; }
.dish { background: var(--surface); border: 2px solid var(--ink); border-radius: var(--r-m); padding: 14px 12px 12px; display: flex; flex-direction: column; gap: 8px; position: relative;
        box-shadow: var(--shadow-s); transition: transform .1s, box-shadow .1s; }
.dish:hover { transform: translate(-1px, -1px); box-shadow: var(--shadow); }
.dish .plate { width: 72%; margin: 0 auto; background: var(--sunken); }
.dish .name { font-size: 14px; font-weight: 600; line-height: 1.35; min-height: 38px; }
.dish .row { display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-wrap: wrap; row-gap: 6px; }
.dish .price { display: flex; flex-direction: column; line-height: 1.15; }
.dish .qty { margin-left: auto; }
/* grid items default to min-width:auto; let long rows (category chips) scroll inside instead of widening the page */
.order > *, .map-wrap > *, .assets > *, .orders > *, .hello > * { min-width: 0; }
html, body { overflow-x: clip; }
.dish .price { font-weight: 900; font-size: 16px; }
.dish .was { color: var(--ink-3); text-decoration: line-through; font-size: 12px; margin-left: 0; font-weight: 400; }
.dish .tags { display: flex; gap: 4px; flex-wrap: wrap; min-height: 20px; }
.qty { display: inline-flex; align-items: center; gap: 4px; }
.qty button { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--ink); background: var(--sun); color: #221c35; font-weight: 900; font-size: 17px; line-height: 1; padding: 0; }
.qty button.minus { background: var(--surface); color: var(--ink); }
.qty span { min-width: 20px; text-align: center; font-weight: 900; }
.dish.in-cart { background: var(--sun-soft); box-shadow: var(--shadow); }

/* the receipt */
.receipt-wrap { position: sticky; top: 130px; }
.receipt { background: var(--paper); color: #2b2620; font-family: var(--mono); font-size: 13px; padding: 22px 20px 26px; position: relative;
           border: 2px solid #221c35; border-bottom: 0; border-radius: var(--r-m) var(--r-m) 0 0;
           --tear: radial-gradient(circle at 8px 0, transparent 7px, var(--paper) 7.5px) 0 0 / 16px 10px repeat-x; }
.receipt::after { content: ""; position: absolute; left: -2px; right: -2px; bottom: -9px; height: 10px; background: var(--tear); transform: rotate(180deg); }
.receipt .hd { text-align: center; border-bottom: 2px dashed #d6ccba; padding-bottom: 10px; margin-bottom: 10px; }
.receipt .hd b { font-family: var(--font); font-size: 17px; font-weight: 900; display: block; }
.receipt .hd span { color: #847a6d; font-size: 12px; }

/* ---------------------------------------------------------------- settings */

dialog { border: 2px solid var(--ink); border-radius: var(--r-l); padding: 0; width: min(460px, calc(100vw - 32px)); background: var(--surface); color: var(--ink); box-shadow: 6px 6px 0 #221c35; }

/* lottery draw: a little wheel that spins while the server draws */
.draw-wheel { width: 132px; height: 132px; margin: 18px auto 8px; border-radius: 50%; border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink);
  background: conic-gradient(var(--ketchup) 0 60deg, var(--sun) 0 120deg, var(--grape) 0 180deg, var(--pickle) 0 240deg, var(--gum) 0 300deg, #fff 0 360deg); position: relative; }

.win { text-align: center; }
.win .tiles.wrap { grid-template-columns: repeat(auto-fit, 150px); justify-content: center; }

<body>
<header>
  <div class="bar">
    <div class="brand"><b>🍟 麦麦交易终端</b><small>帮你点得最省</small><span class="demo-flag hidden" id="demoFlag">演示数据</span></div>
    <div class="mode" role="group" aria-label="点餐方式">
      <button data-mode="pickup" aria-pressed="true">到店自取</button>
      <button data-mode="delivery" aria-pressed="false">外送</button>
    </div>
    <div class="store"><span id="storeName">门店加载中…</span><button id="openSettings">⚙ 我的设置</button></div>
  </div>
  <nav role="tablist" aria-label="页面">
    <button role="tab" data-tab="today" aria-selected="true">今日</button>
    <button role="tab" data-tab="order" aria-selected="false">点餐</button>
    <button role="tab" data-tab="campaigns" aria-selected="false">活动地图</button>
    <button role="tab" data-tab="assets" aria-selected="false">我的券和积分</button>
    <button role="tab" data-tab="mall" aria-selected="false">积分商城</button>
    <button role="tab" data-tab="orders" aria-selected="false">订单</button>
  </nav>
</header>

<main id="main"></main>
<footer>和终端里的 mcd 用同一个引擎；扣积分、下单前都会先问你。遇到问题或有想法，欢迎 <a href="https://github.com/Zhangfengmo/mcd-terminal/issues" target="_blank" rel="noopener">提 Issue</a>。</footer>
<div class="cartbar hidden" id="cartbar"><span id="cartbarText"></span><button class="btn gold" id="cartbarBtn">看小票</button></div>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>

<script>
"use strict";
const SECRET = "__MCD_SECRET__";
const DEMO = __MCD_DEMO__;
const $ = (s, el = document) => el.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const yuan = (v) => (v == null ? "—" : "¥" + Number(v).toFixed(2));
const state = { mapFilter: "all", tab: "today", mode: "pickup", menu: null, cart: new Map(), cat: "全部", q: "", plan: null, planSeq: 0, lastOrder: null };
if (DEMO) $("#demoFlag").classList.remove("hidden");

/* The button that triggered a request shows a spinner until the request finishes. */
let pressed = null;
document.addEventListener("click", (e) => { const b = e.target.closest("button"); pressed = b ? { b, t: performance.now() } : null; }, true);
async function run(args) {
  const btn = pressed && performance.now() - pressed.t < 250 && pressed.b.classList.contains("btn") ? pressed.b : null;
  pressed = null;
  if (btn) { btn.classList.add("is-busy"); btn.setAttribute("aria-busy", "true"); }
  try {
    const res = await fetch("/api/run", { method: "POST", headers: { "Content-Type": "application/json", "X-Mcd-Secret": SECRET },
                                           body: JSON.stringify({ args }) });
    if (!res.ok) return { ok: false, error: res.status === 403 ? "这个页面已经失效，请回到终端重新运行 mcd web" : "请求失败（" + res.status + "）" };
    return await res.json();
  } catch (e) {
    return { ok: false, error: "连不上本机服务，终端里的 mcd web 还开着吗？" };
  } finally {
    if (btn && btn.isConnected) { btn.classList.remove("is-busy"); btn.removeAttribute("aria-busy"); }
  }
}
function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.append(t);
  setTimeout(() => t.remove(), 3200);
}
const modeFlag = () => (state.mode === "delivery" ? "-d" : "-p");

const loader = (text, hint = "", small = false) =>
  `<div class="loader ${small ? "small" : ""}" role="status" aria-live="polite"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span><span>${esc(text)}</span>${hint ? `<span class="hint2">${esc(hint)}</span>` : ""}</div>`;
const skeletonCards = (n) => `<div class="menu-grid" aria-hidden="true">${Array.from({ length: n }, () =>
  `<div class="skel-card"><div class="skel"></div><div class="skel skel-line" style="width:80%"></div><div class="skel skel-line" style="width:45%"></div></div>`).join("")}</div>`;
const sk = (w = "100%", h = 12, extra = "") => `<div class="skel" style="width:${w};height:${h}px;${extra}"></div>`;
const SKELETONS = {
  today: () => `<div class="skel-two" aria-hidden="true"><div class="skel-box" style="padding:30px">${sk("40%", 34)}${sk("70%")}${sk("38%", 64, "margin-top:10px")}${sk("60%")}${sk("55%")}${sk("50%")}${sk("120px", 40, "border-radius:99px;margin-top:8px")}</div>
    <div class="skel-row">${[0, 1].map(() => `<div class="skel-box">${sk("100%", 150)}${sk("80%")}${sk("50%")}</div>`).join("")}</div></div>`,
  map: () => `<div class="skel-side" aria-hidden="true"><div class="skel" style="aspect-ratio:1080/600;border-radius:24px"></div>
    <div class="skel-box">${Array.from({ length: 7 }, () => `<div style="display:grid;grid-template-columns:46px 1fr;gap:10px;align-items:center">${sk("46px", 46, "border-radius:50%")}<div style="display:grid;gap:6px">${sk("85%")}${sk("50%", 10)}</div></div>`).join("")}</div></div>`,
  assets: () => `<div class="skel-side" style="grid-template-columns:clamp(280px,24vw,360px) minmax(0,1fr)" aria-hidden="true"><div class="skel-box" style="padding:22px">${sk("40%")}${sk("60%", 48)}${sk("100%", 14, "border-radius:99px")}${sk("70%")}${sk("140px", 40, "border-radius:99px;margin-top:10px")}</div>
    <div class="skel-row">${Array.from({ length: 4 }, () => `<div class="skel-box" style="grid-template-columns:96px 1fr 60px;align-items:center">${sk("96px", 54)}<div style="display:grid;gap:8px">${sk("60%")}${sk("40%", 10)}</div>${sk("40px", 30)}</div>`).join("")}</div></div>`,
  mall: () => `<div aria-hidden="true">${sk("100%", 64, "border-radius:24px;margin-bottom:24px")}<div class="mall-grid">${Array.from({ length: 8 }, () => `<div class="skel-box">${sk("100%", 120)}${sk("75%")}${sk("40%", 18)}${sk("100%", 8)}</div>`).join("")}</div></div>`,
  orders: () => `<div class="skel-two" style="grid-template-columns:1fr 1fr" aria-hidden="true"><div class="skel-row">${Array.from({ length: 4 }, () => `<div class="skel-box">${sk("70%")}${sk("45%", 10)}</div>`).join("")}</div>
    <div class="skel-box" style="padding:24px">${sk("30%", 22)}${sk("100%", 10)}${sk("40%", 60, "margin:16px auto")}${sk("60%")}${sk("50%")}</div></div>`,
};
const loading = (kind, text, hint = "") => `${loader(text, hint, true)}${SKELETONS[kind]()}`;

/* disable a button and show a spinner on it while its action runs */
async function busy(btn, fn) {
  if (!btn || btn.classList.contains("is-busy")) return fn();
  btn.classList.add("is-busy"); btn.setAttribute("aria-busy", "true");
  try { return await fn(); } finally { if (btn.isConnected) { btn.classList.remove("is-busy"); btn.removeAttribute("aria-busy"); } }
}

/* food emoji when a picture is missing (demo data, or an image that won't load) */
function emojiFor(name) {
  const n = name || "";
  const table = [["薯", "🍟"], ["鸡翅", "🍗"], ["鸡", "🍗"], ["堡", "🍔"], ["巨无霸", "🍔"], ["咖啡", "☕"], ["拿铁", "☕"], ["美式", "☕"], ["奶铁", "☕"],

async function renderToday() {
  const m = $("#main"); m.innerHTML = loading("today", "正在整理今天的情况…");
  const [d, cal] = await Promise.all([run(["today"]), run(["calendar"])]);
  if (!d.ok) return showError(m, d.error);
  const p = d.points || {};
  const todo = [];
  if (p.expiring_soon) todo.push(["⏳", `${p.expiring_soon.toLocaleString()} 积分两个月内过期`, `<button class="linkish" data-go="mall">换成吃的</button>`]);
  for (const c of d.expiring_coupons || []) todo.push(["🎟", `${esc(c.title)} ${c.days_left === 0 ? "今天" : c.days_left === 1 ? "明天" : c.days_left + " 天后"}到期`, `<button class="linkish" data-go="order">去用</button>`]);
  if ((d.claimable || []).length) todo.push(["🎁", `麦麦省还有 ${d.claimable.length} 张券没领`, `<button class="linkish" id="claimBtn">一键领取</button>`]);
  if (!todo.length) todo.push(["✅", "券和积分都不着急，放心攒着", ""]);
  const today = (cal.campaigns || []).filter((x) => (x.tag || "").startsWith("今"));
  m.innerHTML = `

      <div class="hello-main">
        <h2>${esc(d.greeting || "你好")}</h2>

        <div class="points-big"><span class="num">${(p.available ?? 0).toLocaleString()}</span><span class="muted">积分可用</span></div>
        <ul class="todo">${todo.map(([i, t, a]) => `<li><span class="ic">${i}</span><span>${t}${a}</span></li>`).join("")}</ul>
        <p style="margin:22px 0 0"><button class="btn gold" data-go="order">开始点餐</button></p>

/* ---------------------------------------------------------------- activity map */
/* Every campaign lands in a district of an illustrated map, by what it is about. */
const DISTRICTS = [
  { key: "toy", name: "周边玩具铺", emoji: "🧸", x: 790, y: 165, rx: 150, ry: 105, fill: "#ffc2dc",
    re: /玩具|盲盒|公仔|手办|乐园餐|周边|联名|联动|\sX\s|×|帽|丝巾|杯子|钥匙扣|徽章|挂件|限定主题|限量/ },
  { key: "party", name: "派对乐园", emoji: "🎈", x: 760, y: 440, rx: 165, ry: 110, fill: "#d9ceff",
    re: /派对|生日|体验营|读书会|亲子|品鉴|过家家/ },
  { key: "breakfast", name: "早餐小镇", emoji: "☀️", x: 185, y: 405, rx: 140, ry: 100, fill: "#ffe08a", re: /早餐|早八|厚松饼|满分|晨/ },
  { key: "coffee", name: "咖啡山丘", emoji: "☕", x: 445, y: 470, rx: 135, ry: 88, fill: "#f3d2b3", re: /咖啡|麦咖啡|拿铁|美式|奶铁|黑巧/ },
  { key: "new", name: "上新广场", emoji: "🆕", x: 230, y: 160, rx: 160, ry: 110, fill: "#b8f0d4", re: /上新|新品|回归|首发|来袭|登场|限定|🆕/ },
  { key: "deal", name: "优惠大街", emoji: "🎟", x: 515, y: 205, rx: 150, ry: 100, fill: "#ffd3c4",
    re: /\d+(\.\d+)?元|特价|优惠|券|半价|买一送一|立减|会员|卡|霸王餐|抽奖|超值/ },
];
const OTHER = { key: "other", name: "麦麦广场", emoji: "🍟", x: 1000, y: 118, rx: 72, ry: 74, fill: "#ffffff", re: /$^/ };
const ROAD = "M60 300 C 140 250, 200 250, 250 270 S 380 330, 450 330 S 560 300, 620 300 S 800 290, 985 300";

function districtOf(text) { return DISTRICTS.find((d) => d.re.test(text)) || OTHER; }
function toyKind(text) {
  if (/玩具|盲盒|公仔|手办|乐园餐/.test(text)) return "🧸 有玩具";
  if (/周边|联名|联动|\sX\s|×|帽|丝巾|杯子|钥匙扣|徽章|挂件|限定主题|限量/.test(text)) return "🎁 有周边";
  return "";
}
function parseDay(s, year) {
  const m = /(?:(\d{4})年)?(\d{1,2})月(\d{1,2})日/.exec(s || "");
  return m ? new Date(Number(m[1] || year), Number(m[2]) - 1, Number(m[3])) : null;
}
const md = (d) => `${d.getMonth() + 1}/${d.getDate()}`;

/* One pin per campaign: the calendar repeats a campaign on every day it runs. */
function mergeCampaigns(list) {
  const now = new Date(); now.setHours(0, 0, 0, 0);
  const byTitle = new Map();
  for (const c of list) {
    const day = parseDay(c.day, now.getFullYear());
    let x = byTitle.get(c.title);
    if (!x) byTitle.set(c.title, x = { title: c.title, intro: "", detail: "", image: "", days: [] });
    x.intro ||= c.intro || ""; x.detail ||= c.detail || ""; x.image ||= c.image || "";
    if (day && !x.days.some((d) => +d === +day)) x.days.push(day);
  }
  return [...byTitle.values()].map((x) => {
    x.days.sort((a, b) => a - b);
    const today = x.days.some((d) => +d === +now), future = x.days.some((d) => d > now);
    x.when = today ? "today" : future ? "soon" : "past";
    const text = [x.title, x.detail || x.intro].join(" ");
    x.district = districtOf(text); x.toy = toyKind(text);
    const first = x.days[0], last = x.days[x.days.length - 1];
    x.range = !first ? "" : +first === +last ? md(first) : `${md(first)} – ${md(last)}`;
    x.next = x.days.find((d) => d > now);
    return x;
  }).sort((a, b) => ({ today: 0, soon: 1, past: 2 })[a.when] - ({ today: 0, soon: 1, past: 2 })[b.when]);
}

/* Pins sit in a tidy grid inside their island, below its name, so nothing overlaps. */
function placePins(items) {
  const groups = new Map();
  for (const x of items) { const k = x.district.key; groups.set(k, [...(groups.get(k) || []), x]); }
  for (const [, xs] of groups) {
    const d = xs[0].district, gap = 64;
    const cols = Math.max(1, Math.min(xs.length, Math.floor((d.rx * 1.55) / gap)));
    xs.forEach((x, i) => {
      const row = Math.floor(i / cols), inRow = Math.min(cols, xs.length - row * cols), col = i % cols;
      x.px = d.x + (col - (inRow - 1) / 2) * gap;
      x.py = d.y - d.ry + 96 + row * gap;
    });
  }
}

function blob(d, seed) {
  // a soft, slightly uneven island instead of a perfect ellipse
  const pts = [], n = 10;
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2, wob = 1 + .09 * Math.sin(i * 2.3 + seed) + .05 * Math.cos(i * 3.7 + seed);
    pts.push([d.x + Math.cos(a) * d.rx * wob, d.y + Math.sin(a) * d.ry * wob]);
  }
  let p = `M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  for (let i = 0; i < n; i++) {
    const a = pts[i], b = pts[(i + 1) % n], c = pts[(i + 2) % n];
    const m1 = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2], m2 = [(b[0] + c[0]) / 2, (b[1] + c[1]) / 2];
    p += ` Q${b[0].toFixed(1)} ${b[1].toFixed(1)} ${m2[0].toFixed(1)} ${m2[1].toFixed(1)}`;
    if (i === 0) p = `M${m1[0].toFixed(1)} ${m1[1].toFixed(1)}` + p.slice(p.indexOf(" Q"));
  }
  return p + "Z";
}

function mapSvg(items, lot) {
  const used = new Set(items.map((x) => x.district.key));
  const ds = [...DISTRICTS, OTHER].filter((d) => used.has(d.key) || d !== OTHER);
  const counts = (k) => items.filter((x) => x.district.key === k).length;
  const waves = Array.from({ length: 14 }, (_, i) => {
    const x = 40 + (i * 73) % 1000, y = 40 + (i * 131) % 540;
    return `<path class="wave" d="M${x} ${y} q 8 -6 16 0 t 16 0"/>`;
  }).join("");
  const pins = items.map((x, i) => {
    const hasImg = x.image && !x.image.includes("img.example");
    return `<g class="pin ${x.when}" data-pin="${i}" tabindex="0" role="button" aria-label="${esc(x.title)}" transform="translate(${x.px.toFixed(1)} ${x.py.toFixed(1)})">
      <circle class="pulse" r="27"/>
      <circle class="shadow" r="27" cx="3" cy="3"/>
      <circle class="ring" r="27"/>
      <circle class="halo" r="22"/>
      <clipPath id="pc${i}"><circle r="20"/></clipPath>
      ${hasImg ? `<image href="${esc(imgSrc(x.image))}" x="-20" y="-20" width="40" height="40" preserveAspectRatio="xMidYMid slice" clip-path="url(#pc${i})"/>`
               : `<text class="pin-emoji" text-anchor="middle" dominant-baseline="central">${esc(emojiFor(x.title) === "🍽️" ? x.district.emoji : emojiFor(x.title))}</text>`}
      ${x.toy ? `<circle class="badge-bg" cx="20" cy="-20" r="11"/><text class="badge" x="20" y="-20" text-anchor="middle" dominant-baseline="central">${x.toy.startsWith("🧸") ? "🧸" : "🎁"}</text>` : ""}
      <title>${esc(x.title)}${x.range ? " · " + esc(x.range) : ""}</title>
    </g>`;
  }).join("");
  const wheel = lot ? `<g class="wheel" tabindex="0" role="button" aria-label="积分抽奖：${esc(lot.name)}" transform="translate(1022 300)">
      <path d="M-26 46 L0 0 L26 46" fill="none" stroke="#221c35" stroke-width="4" stroke-linejoin="round"/>
      <circle cx="3" cy="3" r="36" fill="#221c35"/>
      <circle class="rim" r="36" fill="#fff" stroke="#221c35" stroke-width="2.5"/>
      <g class="spokes">
      ${Array.from({ length: 8 }, (_, k) => `<line x1="0" y1="0" x2="${(Math.cos(k * Math.PI / 4) * 32).toFixed(1)}" y2="${(Math.sin(k * Math.PI / 4) * 32).toFixed(1)}" stroke="#221c35" stroke-width="2"/>`).join("")}
      ${Array.from({ length: 8 }, (_, k) => `<circle cx="${(Math.cos(k * Math.PI / 4 + .39) * 33).toFixed(1)}" cy="${(Math.sin(k * Math.PI / 4 + .39) * 33).toFixed(1)}" r="6" stroke="#221c35" stroke-width="1.5" fill="${["#ff5a36", "#7a5cff", "#ffc93c", "#ff6fae"][k % 4]}"/>`).join("")}
      </g>
      <circle r="8" fill="#ffc93c" stroke="#221c35" stroke-width="2"/>
      <text y="70" text-anchor="middle" class="district-label">🎰 积分抽奖</text>
      <title>${esc(lot.name)}</title></g>` : "";
  return `<svg class="map" viewBox="0 0 1080 600" role="img" aria-label="活动地图">
    <rect class="sea" width="1080" height="600"/>${waves}
    ${ds.map((d, i) => `<path class="land" d="${blob(d, i * 1.7)}" fill="${d.fill}"/>`).join("")}
    <path class="road-edge" d="${ROAD}"/><path class="road" d="${ROAD}"/><path class="road-dash" d="${ROAD}"/>
    ${ds.map((d) => `<text class="district-label" x="${d.x}" y="${d.y - d.ry + 30}" text-anchor="middle">${d.emoji} ${esc(d.name)}</text>
      <text class="district-count" x="${d.x}" y="${d.y - d.ry + 48}" text-anchor="middle">${counts(d.key) ? counts(d.key) + " 个活动" : "暂时没有"}</text>`).join("")}
    ${wheel}${pins}
  </svg>`;
}

/* Menu items a campaign mentions, at the store the user orders from. */
async function ensureMenu() {
  if (state.menu) return { ok: true };
  const d = await run(["menu", modeFlag(), "--limit", "500"]);
  if (d.ok) state.menu = d.items || [];
  return d;
}
function campaignItems(x) {
  const text = [x.title, x.detail || x.intro].join(" ").replace(/\s+/g, "");
  const hits = (state.menu || []).filter((m) => m.name.length >= 2 && text.includes(m.name.replace(/\s+/g, "")));
  hits.sort((a, b) => b.name.length - a.name.length);
  // drop "麦旋风" when "蓝莓爆爆珠麦旋风" is also there: keep the specific item
  return hits.filter((m, i) => !hits.slice(0, i).some((o) => o.name.includes(m.name))).slice(0, 8);
}

function setQty(code, delta) {
  const n = Math.max(0, (state.cart.get(code) || 0) + delta);
  n ? state.cart.set(code, n) : state.cart.delete(code);
  drawMenu(); schedulePlan();
}
let planTimer;
function schedulePlan() { clearTimeout(planTimer); planTimer = setTimeout(computePlan, 350); drawReceipt(true); }
const cartArgs = () => [...state.cart].map(([code, n]) => `code:${code}${n > 1 ? "x" + n : ""}`);
async function computePlan() {
  if (!state.cart.size) { state.plan = null; drawReceipt(); return; }
  const seq = ++state.planSeq;
  const d = await run(["order", ...cartArgs(), modeFlag(), "-n"]);
  if (seq !== state.planSeq) return;  // a newer cart is on its way
  state.plan = d; drawReceipt(false, true);
}

  $("#cartbarText").innerHTML = `已选 ${n} 样${pay != null ? ` · 实付 <b class="num">${yuan(pay)}</b>` : " · 计算中…"}`;
  bar.classList.remove("hidden");
}

  const st = o.status || "";
  const done = /完成|已取|送达/.test(st), cancelled = /取消|退款/.test(st);
  const step = cancelled ? 0 : done ? 4 : /配送|送餐/.test(st) ? 3 : /制作|备餐/.test(st) ? 2 : /支付|接单|已下单/.test(st) && !/待支付/.test(st) ? 1 : 0;
  t.innerHTML = `<h3>${esc(st)}</h3><p class="muted" style="margin:4px 0 0">${esc(o.hint || "")}</p>
    <div class="steps" aria-hidden="true">${[1, 2, 3, 4].map((i) => `<span class="${i <= step ? "on" : ""}"></span>`).join("")}</div>
    ${o.pickup_code && !done && !cancelled ? `<div class="pickup"><span class="muted">取餐码</span><b class="num">${esc(o.pickup_code)}</b></div>` : ""}
    <p>${esc(o.store || "")}${o.delivery_address ? " → " + esc(o.delivery_address) : ""}</p>
    <ul>${(o.items || []).map((x) => `<li>${esc(x.name)} x${esc(x.quantity)}</li>`).join("")}</ul>
    <p>实付 <b class="num">¥${esc(o.pay_yuan)}</b>${o.discount_yuan && o.discount_yuan !== "0" ? `，优惠 ¥${esc(o.discount_yuan)}` : ""}</p>
    ${!done && !cancelled ? `<p style="display:flex;gap:8px"><button class="btn ghost" id="refresh">刷新</button><button class="btn ghost" id="cancel">取消这单</button></p>` : ""}
    ${done ? `<div class="survey" id="survey">${loader("看看这单的问卷送没送券…", "", true)}</div>` : ""}`;
  if (done) loadSurvey(oid);
  const r = $("#refresh"); if (r) r.addEventListener("click", () => showTrack(oid));
  const c = $("#cancel"); if (c) c.addEventListener("click", () => openDialog(`<h3>取消这单？</h3><p>取消后不能恢复；如果已经付过款，退款会原路退回。</p>
    <div class="actions"><button class="btn ghost" data-close>不取消了</button><button class="btn" data-yes>确定取消</button></div>`,
    (dlg) => dlg.querySelector("[data-yes]").addEventListener("click", async () => {
      const x = await run(["cancel", oid, "-y"]); closeDialog(); toast(x.ok ? "这单已经取消了" : x.error); renderOrders();
    })));
}

/* ---------------------------------------------------------------- settings */
/* Everything saved in prefs.json (mcd config), shown and edited in one place. */
const ADDR_RULES = {
  city: [(v) => /^[\u4e00-\u9fa5]{2,10}市?$/.test(v), "写中文城市名，例如 上海"],
  name: [(v) => v.length >= 1 && v.length <= 20 && !/^\d+$/.test(v), "写个称呼，1–20 个字"],
  phone: [(v) => /^1[3-9]\d{9}$/.test(v.replace(/[\s-]/g, "")), "11 位手机号"],
  street: [(v) => v.length >= 2 && v.length <= 60, "小区或楼宇，2–60 个字"],
  detail: [(v) => v.length >= 1 && v.length <= 40, "门牌号，例如 3 楼 302"],
};
function headerFrom(raw) {
  if (state.mode === "delivery") {
    $("#storeName").textContent = raw && raw.address ? "🛵 送到 " + raw.address : "🛵 外送：还没设置收货地址";
  } else {
    $("#storeName").textContent = raw && raw.store ? "🏪 " + raw.store.name : "🏪 第一次点餐时自动选门店";
  }
}
async function loadStore() {
  const d = await run(["config"]);
  if (!d.ok) return;
  state.config = d.raw || {};
  if ((state.config.mode === "delivery") !== (state.mode === "delivery")) {
    state.mode = state.config.mode === "delivery" ? "delivery" : "pickup";
    document.querySelectorAll(".mode button").forEach((x) => x.setAttribute("aria-pressed", String(x.dataset.mode === state.mode)));
  }
  headerFrom(state.config);
}
async function openSettings(focus) {
  $("#dlg").classList.add("wide");
  openDialog(`<h3>我的设置</h3>${loader("读取设置和收货地址…", "", true)}`);
  const [c, a] = await Promise.all([run(["config"]), run(["address"])]);
  const raw = (c.ok && c.raw) || {};
  const addrs = (a.ok && a.addresses) || [];
  const pts = raw.points == null ? "auto" : raw.points === "off" ? "off" : "cap";
  const seg = (name, cur, opts) => `<div class="seg" role="group" data-seg="${name}">${opts.map(([v, t]) => `<button data-v="${v}" aria-pressed="${v === cur}">${t}</button>`).join("")}</div>`;
  setDialog(`<h3>我的设置</h3>
    <p class="muted" style="margin:0 0 6px;font-size:13px">点餐时自动用这些设置，不用每次都选；只保存在你这台电脑上。</p>
    <section class="set"><h4>点餐方式</h4>${seg("mode", raw.mode === "delivery" ? "delivery" : "pickup", [["pickup", "🏪 到店自取"], ["delivery", "🛵 外送"]])}</section>
    <section class="set"><h4>到店门店</h4>
      <p class="now">${raw.store ? "现在：" + esc(raw.store.name) : "还没选，第一次点餐时会用你上次去过的店"}</p>
      <div class="inline"><input id="sCity" placeholder="城市，如 上海" value="${esc(raw.city || "")}"><input id="sNear" placeholder="附近的地点，如 人民广场"><button class="btn ghost" id="sStore">找最近的店</button></div>
    </section>
    <section class="set" id="setAddr"><h4>收货地址</h4>
      ${addrs.length ? `<div class="addr-list" role="radiogroup" aria-label="默认收货地址">${addrs.map((x) => `
        <button class="addr" role="radio" aria-checked="${String(x.address_id) === String(raw.address_id)}" data-aid="${esc(x.address_id)}">
          <span class="dot"></span><span><b>${esc(x.address)}</b><small>${esc(x.contact || "")} ${esc(x.phone || "")}</small></span>
          ${String(x.address_id) === String(raw.address_id) ? `<span class="chip gold">默认</span>` : ""}</button>`).join("")}</div>`
        : `<p class="now">还没有收货地址，外送前先加一个。</p>`}
      <details ${addrs.length ? "" : "open"} id="addrForm"><summary class="linkish" style="cursor:pointer">＋ 新增收货地址</summary>
        <form class="form" novalidate>
          <div><label for="fCity">城市</label><input id="fCity" name="city" placeholder="上海" value="${esc(raw.city || "")}"><div class="hint"></div></div>
          <div><label for="fName">收货人</label><input id="fName" name="name" placeholder="张先生" autocomplete="name"><div class="hint"></div></div>
          <div><label for="fGender">称谓</label><select id="fGender" name="gender"><option value="">不填</option><option>先生</option><option>女士</option></select><div class="hint"></div></div>
          <div><label for="fPhone">手机号</label><input id="fPhone" name="phone" inputmode="numeric" placeholder="13800000000" autocomplete="tel"><div class="hint"></div></div>
          <div class="full"><label for="fStreet">小区 / 楼宇</label><input id="fStreet" name="street" placeholder="人民大道 200 号" autocomplete="street-address"><div class="hint"></div></div>
          <div class="full"><label for="fDetail">门牌号</label><input id="fDetail" name="detail" placeholder="3 楼 302"><div class="hint"></div></div>
          <div class="full" style="display:flex;gap:10px;align-items:center;margin-top:6px"><button class="btn gold" type="submit">保存这个地址</button>
            <span class="muted" style="font-size:12px">会保存到你的麦当劳账号；同一个地址不会重复添加。</span></div>
        </form></details>
    </section>
    <section class="set"><h4>积分怎么用</h4>
      <div class="inline">${seg("points", pts, [["auto", "能用就用"], ["off", "点餐不用积分"], ["cap", "每单最多"]])}
        <input id="sCap" type="number" min="1" step="50" placeholder="1000" value="${typeof raw.points === "number" ? raw.points : ""}" style="max-width:120px"><span class="muted">积分</span></div>
    </section>
    <section class="set"><h4>到店取餐</h4>${seg("take", raw.take_way || "", [["", "门店默认"], ["堂食", "堂食"], ["外带", "外带"]])}</section>
    <div class="actions"><button class="btn" data-close>好了</button></div>`, (dlg) => bindSettings(dlg, addrs));
  if (focus === "address") { const f = document.getElementById("addrForm"); if (f) { f.open = true; f.scrollIntoView({ block: "center" }); } }
}
function bindSettings(dlg, addrs) {
  const saved = async (args, msg) => {
    const d = await run(args);
    toast(d.ok ? msg : d.error);
    if (d.ok) { await loadStore(); state.menu = null; state.plan = null; }
    return d;
  };
  dlg.querySelectorAll("[data-seg]").forEach((g) => g.querySelectorAll("button").forEach((b) => b.addEventListener("click", async () => {
    g.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    const v = b.dataset.v, kind = g.dataset.seg;
    if (kind === "mode") {
      if (v === "delivery" && !addrs.length) { toast("先加一个收货地址"); document.getElementById("addrForm").open = true; }
      await saved(["config", "mode", v], v === "delivery" ? "以后默认外送" : "以后默认到店自取");
    } else if (kind === "points") {
      if (v === "cap") { const n = parseInt($("#sCap", dlg).value, 10); if (!n) { toast("填一下每单最多用多少积分"); $("#sCap", dlg).focus(); return; } await saved(["config", "points", String(n)], `每单最多用 ${n} 积分`); }
      else await saved(["config", "points", v], v === "off" ? "点餐不用积分" : "积分能用就用");
    } else if (kind === "take") {
      if (v) await saved(["config", "take-way", v], "到店默认" + v); else await saved(["config", "reset", "take_way"], "取餐方式交给门店");
    }
  })));
  $("#sCap", dlg).addEventListener("change", (e) => { const n = parseInt(e.target.value, 10); if (n > 0) saved(["config", "points", String(n)], `每单最多用 ${n} 积分`); });
  $("#sStore", dlg).addEventListener("click", async () => {
    const city = $("#sCity", dlg).value.trim(), near = $("#sNear", dlg).value.trim();
    if (!city || !near) return toast("城市和附近的地点都要填");
    const d = await saved(["config", "store", "-c", city, "-l", near], "找到了，以后默认去这家");
    if (d.ok) openSettings();
  });
  dlg.querySelectorAll("[data-aid]").forEach((b) => b.addEventListener("click", async () => {
    const d = await saved(["config", "address", b.dataset.aid], "外送默认送到这里");
    if (d.ok) openSettings();
  }));
  const form = dlg.querySelector("form.form");
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    let ok = true;
    for (const [key, [test, hint]] of Object.entries(ADDR_RULES)) {
      const input = form.elements[key], v = input.value.trim(), good = test(v);
      input.setAttribute("aria-invalid", String(!good));
      input.parentElement.querySelector(".hint").textContent = good ? "" : hint;
      ok = ok && good;
    }
    if (!ok) return;
    const f = (k) => form.elements[k].value.trim();
    const args = ["address", "add", "-c", f("city"), "--name", f("name"), "--phone", f("phone").replace(/[\s-]/g, ""), "--street", f("street"), "--detail", f("detail")];
    if (f("gender")) args.push("--gender", f("gender"));
    const d = await saved(args, "地址保存好了，外送默认送到这里");
    if (d.ok) openSettings();
  });
}

/* ---------------------------------------------------------------- dialog */
function openDialog(html, bind) { setDialog(html, bind); const d = $("#dlg"); if (!d.open) d.showModal(); }
function setDialog(html, bind) {
  const dlg = $("#dlg"); $("#dlgBody").innerHTML = html;
  dlg.querySelectorAll("[data-close]").forEach((b) => b.addEventListener("click", closeDialog));
  if (bind) bind(dlg);
}
function closeDialog() { $("#dlg").close(); $("#dlg").classList.remove("wide", "xwide"); }
$("#dlg").addEventListener("click", (e) => { if (e.target === e.currentTarget) closeDialog(); });
$("#dlg").addEventListener("close", () => $("#dlg").classList.remove("wide", "xwide"));

loadStore();
go("today");
</script>
</body>
</html>
